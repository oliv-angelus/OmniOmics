# Release notes shown in the Hub's "Notícias e atualizações" panel.
#
# Served by GET /api/changelog, newest first. Deliberately a file in the repo
# rather than a remote feed: the app must work on a machine with no internet,
# and nothing about a user's install should leave their computer to fetch news.
#
# Each entry's text follows the same {pt, en} convention the pipeline manifests
# use, so localizedManifestText reads it unchanged. Keep the newest version at
# the top; the panel shows the five most recent entries.

# `unreleased: true` means CITATION.cff has not been bumped to this version yet.
# The news panel shows "não lançado" instead of a version pill, so the app can
# never announce a version it does not identify as. Flip it (and bump
# CITATION.cff, which is the single source the About screen, the generated
# citation and build.sh all read) when this actually ships.
- version: "0.0.8-alpha"
  date: 2026-09-12
  entries:
    - pt: "**A construção da árvore filogenética do PRISM (caminhos DADA2 e Emu) agora usa FastTree 2**, em vez do antigo alinhamento DECIPHER seguido de refinamento por máxima verossimilhança do phangorn. O passo de refinamento antigo não usava mais de um núcleo e ficava extremamente lento com muitas sequências (milhares de ASVs ou espécies detectadas) — o FastTree 2 escala quase linearmente e usa multithreading de verdade."
      en: "**PRISM's phylogenetic tree building (both the DADA2 and Emu paths) now uses FastTree 2**, instead of the previous DECIPHER alignment followed by phangorn's maximum-likelihood refinement. The old refinement step had no multicore support at all and became extremely slow with many sequences (thousands of ASVs or detected species) — FastTree 2 scales near-linearly and uses real multithreading."

- version: "0.0.4-alpha"
  date: 2026-09-07
  entries:
    - pt: "**O preset padrão de 16S completo (27F/1492R) do PRISM não descartava mais 100% das reads no corte de primer.** O primer reverso estava gravado já invertido-complementado no manifesto e no card do Cutadapt na aba Tools; o código invertia de novo antes de montar o adaptador, então nenhuma read sobrevivia ao Cutadapt — em qualquer amostra, PacBio ou Nanopore — travando o VSEARCH logo depois com um arquivo vazio. Corrigido para a sequência literal do 1492R (Lane 1991), e as flags manuais `-g`/`-G` da aba Tools agora vêm desligadas por padrão, para não sobrescrever silenciosamente o preset escolhido na aba Inputs."
      en: "**PRISM's default full-length 16S preset (27F/1492R) no longer discards 100% of reads at primer trimming.** The reverse primer was stored already reverse-complemented, both in the manifest and in the Tools tab's Cutadapt card; the code reverse-complemented it again before building the adapter, so no read survived Cutadapt — on any sample, PacBio or Nanopore — which then starved VSEARCH with an empty file right after. Fixed to the literal 1492R sequence (Lane 1991), and the Tools tab's manual `-g`/`-G` flags now default to off, so they no longer silently override the preset chosen on the Inputs tab."
    - pt: "**A geração de FASTQ de demonstração do PRISM agora também escreve um `metadata.tsv`** pronto para testar a aba de Gráficos, com as 3 amostras lidas como um gradiente de profundidade (superfície/coluna d'água/sedimento) num mesmo lago."
      en: "**PRISM's demo FASTQ generator now also writes a `metadata.tsv`** ready to test the Plots tab with, reading the 3 samples as a depth gradient (surface/water column/sediment) in one lake."

- version: "0.0.3-alpha"
  date: 2026-09-07
  entries:
    - pt: "**Uma run cuja pasta de saída é protegida (como sua própria pasta pessoal, escolhida por engano) agora pode ser removida do histórico.** Antes, o registro ficava preso para sempre: a mesma trava de segurança que impede o app de apagar uma pasta perigosa também impedia a run de sumir da lista de Resultados."
      en: "**A run whose output folder is a protected path (like your own home directory, picked by mistake) can now be removed from history.** It used to get stuck there forever — the same safety guard that stops the app from deleting a dangerous folder was also blocking the run from ever leaving the Results list."
    - pt: "**Botão de Tentar novamente para runs que falharam, pararam ou até terminaram com sucesso**, no Monitor e nos Resultados — reaproveita a mesma configuração, e o Snakemake refaz só o que faltou ou falhou (nunca dispara de novo o que já tinha terminado)."
      en: "**A Retry button for runs that failed, stopped, or even finished successfully**, in both Monitor and Results — reuses the exact same configuration, and Snakemake only redoes what's missing or failed (it never reruns what already finished)."
    - pt: "**O Grafo ao vivo do Monitor agora realmente aparece.** O plugin de monitoramento embrulha o DAG num nível a mais do que o app esperava, então o grafo chegava vazio e só a Lista de jobs parecia funcionar — corrigido no backend. O tamanho das caixas e da fonte do grafo também passou a ser ajustável em Ajustes, aplicado na hora, sem reiniciar o app."
      en: "**The Monitor's live Graph view actually shows up now.** The monitoring plugin wraps the DAG one level deeper than the app expected, so the graph arrived empty and only the job List looked populated — fixed on the backend. The graph's box and font size is also now adjustable in Settings, applied immediately, no app restart needed."
    - pt: "**O PRISM não trava mais na classificação por Nanopore (Emu) nem no DADA2** quando o banco de referência (GTDB/SILVA) está configurado como uma pasta — a run agora resolve o arquivo `.fa` de verdade dentro dela, em vez de passar o diretório inteiro para a ferramenta (o mesmo tipo de bug já corrigido antes só para o Kaiju)."
      en: "**PRISM no longer stalls at Nanopore (Emu) classification or DADA2** when the reference database (GTDB/SILVA) is configured as a folder — the run now resolves the actual `.fa` file inside it, instead of handing the whole directory to the tool (the same class of bug already fixed for Kaiju elsewhere)."
    - pt: "**O MAGMA agora produz um catálogo final de MAGs** (`final_mag_catalog`), com a mesma lógica MIMAG/MISAG usada na aba de gráficos — útil para quem roda em HPC, sem acesso à interface. De quebra, nove saídas por-MAG do módulo de mobiloma que vinham nomeadas errado (`{mag}.fa.fa`) voltaram a `{mag}.fa`, e o banco do GUNC passou a ser resolvido de verdade em vez de nunca ser escrito no `config.yaml`."
      en: "**MAGMA now produces a final MAG catalog** (`final_mag_catalog`), using the same MIMAG/MISAG logic as the Plots tab — useful for anyone running on HPC with no access to the interface. Along the way, nine per-MAG mobilome outputs that were misnamed (`{mag}.fa.fa`) went back to `{mag}.fa`, and GUNC's database path is now actually resolved instead of never being written to `config.yaml`."
    - pt: "**Uma falha isolada não trava mais a run inteira.** Um banco de dados faltando ou uma amostra que quebra uma ferramenta agora só interrompe aquele ramo do DAG — os outros continuam até o fim, nos cinco pipelines."
      en: "**One failure no longer stalls the whole run.** A missing database or a sample that crashes a tool now only stops that branch of the DAG — every other branch still finishes, across all five pipelines."
    - pt: "**Runs com `--use-conda` não falham mais com \"conda: comando não encontrado\".** O Snakemake constrói o ambiente de uma regra chamando o conda por conta própria, num processo separado que não herdava o PATH configurado nos Ajustes."
      en: "**Runs using `--use-conda` no longer fail with \"conda: command not found\".** Snakemake builds a rule's environment by calling conda itself, in a separate process that was not inheriting the PATH configured in Settings."
    - pt: "**A tela de Monitor ganhou uma visão em Grafo do DAG**, ao vivo, alternável com a Lista de jobs. Por trás, os eventos do Snakemake agora chegam pela API oficial de logger-plugin em vez de um parser de texto da saída padrão."
      en: "**The Monitor screen gained a live Graph view of the DAG**, toggled alongside the job List. Behind it, Snakemake's events now arrive through the official logger-plugin API instead of a stdout text parser."
    - pt: "**Títulos cortados nos gráficos foram corrigidos** — a barra de título agora mede o texto de verdade em vez de estimar, e passa a caber a largura real do painel. Isso por si só resolveu 7 títulos cortados só na suíte do MAGMA."
      en: "**Clipped chart titles are fixed** — the title bar now measures the actual text instead of estimating it, and fits the panel's real width. That alone resolved 7 clipped titles in MAGMA's suite."
    - pt: "**Nova análise: abundância dos MAGs entre amostras.** Reconecta cada MAG à comunidade de onde veio, cruzando a cobertura por amostra com a linhagem GTDB e o nível MIMAG."
      en: "**New analysis: MAG abundance across samples.** Reconnects each MAG to the community it came from, crossing per-sample coverage with GTDB lineage and MIMAG tier."
    - pt: "**Nova análise: visão geral de qualidade dos MAGs**, usando os cortes MIMAG publicados (Bowers et al. 2017) e marcando quimerismo (GUNC) separadamente do nível de qualidade."
      en: "**New analysis: MAG quality overview**, using the published MIMAG cut-offs (Bowers et al. 2017) and flagging chimerism (GUNC) separately from the quality tier."
    - pt: "**O ambiente R da aba de Gráficos agora pode ser instalado pelo próprio app**, com uma tela de progresso — antes, o erro dizia o que faltava mas não havia como resolver pela interface. A definição do ambiente também tinha um pacote no canal errado (`ape` é do CRAN, não do Bioconductor), o que impedia a instalação de qualquer jeito."
      en: "**The Plots tab's R environment can now be installed from within the app**, with a progress screen — before, the error named what was missing with no way to fix it from the interface. The environment spec also had a package pinned to the wrong channel (`ape` is CRAN, not Bioconductor), which blocked the install either way."
    - pt: "**O relatório de run voltou a ser escrito.** Um erro de um caractere impedia que `run_report.txt` fosse gerado — nenhuma run jamais o produziu. Ele traz o parágrafo de Métodos, as versões travadas de cada ferramenta e as referências com DOI."
      en: "**The run report is written again.** A one-character bug meant `run_report.txt` was never produced, for any run. It carries the drafted Methods paragraph, each tool's pinned version and the DOI reference list."
    - pt: "**Recursos do sistema agora aparecem em todas as telas**, numa barra fixa no rodapé. A aba Recursos foi aposentada — ela não mostrava nada além disso."
      en: "**System resources now show on every screen**, in a fixed footer strip. The Resources tab is retired — it showed nothing beyond this."
    - pt: "**HMMER e wget do VIBRANT são encontrados mesmo abrindo o app pelo lançador.** A checagem consultava só o PATH, que não inclui o conda quando o app não é aberto por um terminal."
      en: "**VIBRANT's HMMER and wget are found when the app is opened from the launcher.** The check consulted only PATH, which does not include conda unless the app is started from a shell."
    - pt: "As dependências Python agora dizem que estão **incluídas no aplicativo**, em vez de relatarem uma verificação que nunca acontece no build empacotado."
      en: "The Python dependencies row now says they are **bundled with the application**, instead of reporting a check that never runs in the packaged build."
    - pt: "O log de instalação **acompanha a última linha** sozinho, e para de acompanhar se você rolar para cima para ler."
      en: "The install log **follows its latest line** on its own, and stops following if you scroll up to read."

- version: "0.0.1-alpha"
  date: 2026-08-12
  entries:
    - pt: "Primeira versão alpha, com os cinco pipelines — MAGMA, SIGMA, DOGMA, DEFINE e PRISM — e a aba de gráficos com 41 análises."
      en: "First alpha release, with all five pipelines — MAGMA, SIGMA, DOGMA, DEFINE and PRISM — and the plots tab's 41 analyses."
