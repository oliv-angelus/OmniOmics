# Shared conda env for the Plots tab's R compute/export scripts. Resolved and
# built on demand by plots_engine.py (mirrors snakemake_manager.install_snakemake's
# `conda create -n <name> -f <this file>` pattern), not per-pipeline like the
# Snakemake rule envs under pipelines/*/workflow/envs/ -- there's exactly one
# R analysis engine shared by every pipeline's output, so one env, name "r-plots".
name: r-plots
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base>=4.3
  - bioconductor-phyloseq
  - bioconductor-deseq2
  # ape is CRAN, not Bioconductor, so the package is r-ape. It was listed here
  # as `bioconductor-ape`, which does not exist in bioconda -- almost certainly
  # confused with `bioconductor-apeglm` further down, which is a different
  # package (DESeq2's shrinkage estimator, used by ma_plot.R) and is correct.
  # The mistake made `conda env create -f` fail outright with
  # PackagesNotFoundInChannelsError, so r-plots could not be built from this
  # file at all and the whole Plots tab was unreachable on a fresh machine.
  # Required by load_phyloseq.R, build_phyloseq.R, build_dogma_table.R and
  # beta_diversity.R (ape::pcoa).
  - r-ape
  - r-vegan
  - r-permute
  - r-patchwork
  - r-ggplot2
  - r-ggrepel
  - r-rcolorbrewer
  - r-tidyverse
  - r-dplyr
  - r-tibble
  - r-forcats
  - r-indicspecies
  - r-igraph
  - r-ggraph
  - r-hmisc
  - r-ggvenndiagram
  - r-complexupset
  # circlize: the circular genome ring (sigma_genome_ring). Gu et al. 2014,
  # Bioinformatics 30:2811, doi:10.1093/bioinformatics/btu393.
  - r-circlize
  - r-svglite
  - r-jsonlite
  - r-optparse
  - bioconductor-apeglm
  - bioconductor-clusterprofiler
