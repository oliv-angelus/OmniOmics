# Plots tab analysis manifest. One entry per analysis, mirroring pipeline.yaml's
# tools/flags schema (type/default/min/max/choices/description{en,pt}) so the
# existing form-building logic can be reused rather than reinvented.
#
# applies_to: which pipelines' outputs this analysis can run against (filters
#   the analysis list once a run is picked in the app). This whole
#   community-ecology set (phyloseq-based: alpha/beta diversity, composition,
#   core microbiome, DESeq2, RDA, network, IndVal, Venn) is MAGMA-only for
#   now, by explicit user decision -- DOGMA/other omics need their own
#   analysis sets designed separately later, not just added to this list,
#   since each omics track has genuinely different questions/shapes.
# input_shape: "phyloseq" (abundance.tsv with a ';'-separated `tax` lineage
#   column, e.g. MAGMA's abundance_table_final_RAW.tsv) or "count_matrix"
#   (gene/feature x sample counts, e.g. DEFINE's contagem_anotada.tsv). Only
#   phyloseq-shaped analyses are wired for Phase 1; DESeq2's count_matrix path
#   (DEFINE) is future work -- see notes/Known Issues and Next Steps.md.
# script: path relative to plots/scripts/, source of the real R computation.
#   All 9 analyses below are real (built incrementally, one at a time --
#   see notes/Known Issues and Next Steps.md for the order and how each was
#   verified against real data). _stub_common.R still exists as the shared
#   body for any *future* analysis added here before its real statistics
#   are written.
# implemented: false marks an analysis as still a stub (no real statistics,
#   no preview.png) -- the app shows these visibly de-emphasized/"Em breve",
#   same visual treatment the Hub already uses for not-yet-built pipelines,
#   so picking one doesn't read as a broken result. Defaults to true when
#   omitted -- every analysis here currently omits it.
#
# Parameter types beyond the pipeline.yaml-shared int/float/bool/str/choice:
#   "column": the user picks one of the loaded metadata table's real column
#     names -- populated by POST /api/plots/load (see plots_screen.dart), not
#     typed freehand. No `default`: a dropdown starts unselected and is
#     always required.
#   "level": the user picks one of the *values* found in whichever column is
#     currently selected for another "column"-type parameter, named by
#     `depends_on` (that parameter's own flag). E.g. reference_group below
#     depends_on group_var -- its choices are group_var's column's own
#     detected levels, recomputed client-side whenever group_var changes.
#   "tax_rank": the user picks one of the *real taxonomic ranks the loaded
#     data actually has* (PlotLoadedData.taxRanks, from load_phyloseq.R's
#     build_phyloseq() call -- Domain/Phylum/.../Species for GTDB-derived
#     data, or with Kingdom too for Kraken2/NCBI-derived data, detected
#     dynamically, not a fixed list -- see build_phyloseq.R's own comment on
#     why 7 vs. 8 ranks isn't a fixed "GTDB vs. Kraken" rule). A hardcoded
#     `choices: [...]` list here previously left Domain/Kingdom/Species
#     unselectable even when the user's own data genuinely had them -- a
#     real reported gap, not a deliberate scope cut. Two optional flags add
#     synthetic, non-taxonomic choices some analyses offer alongside the
#     real ranks: `include_all: true` prepends "all" (one figure per rank at
#     once -- taxonomic_composition's own default), `include_asv: true`
#     appends "ASV" (skip aggregation, plot at the raw ASV/OTU level).
#
# List order below is deliberate, not alphabetical/insertion-order -- it's
# the order the analyses cards render in (plots_engine.get_analysis_list
# preserves this list's order verbatim, see plot_workspace_screen.dart's
# _buildAnalysesList), and a real reported complaint was that the previous
# order (goods_coverage, upset_plot, rarefaction_curve, alpha_diversity, ...)
# read as arbitrary/insertion-order (new analyses had each been appended or
# slotted in wherever was most convenient to edit at the time). Grouped now
# into the natural order a real analysis session actually goes through: QC
# (sequencing depth adequacy) -> diversity -> composition -> statistical
# comparisons -> set-overlap. Keep new entries grouped with their nearest
# conceptual neighbor, not just appended at the end.

analyses:
  # --- QC: sequencing depth adequacy, before trusting anything downstream ---
  - id: goods_coverage
    name:
      en: "Good's Coverage"
      pt: "Good's Coverage"
    description:
      en: "Per-sample Good's Coverage (sequencing depth adequacy) as a sorted bar chart, with a reference cutoff line."
      pt: "Good's Coverage por amostra (adequação da profundidade de sequenciamento) em gráfico de barras ordenado, com linha de referência do limiar."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/goods_coverage.R
    parameters:
      - flag: "--cutoff"
        type: float
        default: 0.98
        enabled: true
        description:
          en: "Reference coverage cutoff drawn as a dashed line (0.98 = 98%)"
          pt: "Limiar de cobertura de referência desenhado como linha tracejada (0,98 = 98%)"
        min: 0.0
        max: 1.0

  - id: rarefaction_curve
    name:
      en: "Rarefaction Curve"
      pt: "Curva de Rarefação"
    description:
      en: "Observed richness vs. sequencing depth per sample, with a reference line at the shallowest sample's depth."
      pt: "Riqueza observada em função da profundidade de sequenciamento por amostra, com linha de referência na profundidade da amostra mais rasa."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/rarefaction_curve.R
    parameters:
      - flag: "--step"
        type: int
        default: 100
        enabled: true
        description:
          en: "Subsampling step size for the rarefaction curve"
          pt: "Tamanho do passo de subamostragem para a curva de rarefação"
        min: 1

  # --- Diversity ---
  - id: alpha_diversity
    name:
      en: "Alpha Diversity"
      pt: "Alfa Diversidade"
    description:
      en: "Observed richness, Chao1, ACE, Shannon, Simpson, and Pielou's evenness per sample, grouped and Kruskal-Wallis-tested by a chosen metadata variable."
      pt: "Riqueza observada, Chao1, ACE, Shannon, Simpson e equitabilidade de Pielou por amostra, agrupados e testados por Kruskal-Wallis segundo uma variável de metadados escolhida."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/alpha_diversity.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to group samples by (also used for the Kruskal-Wallis test)"
          pt: "Coluna de metadados para agrupar as amostras (também usada no teste de Kruskal-Wallis)"
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed for rarefaction (reproducibility)"
          pt: "Semente aleatória para a rarefação (reprodutibilidade)"
        min: 0

  - id: beta_diversity
    name:
      en: "Beta Diversity (PCoA)"
      pt: "Beta Diversidade (PCoA)"
    description:
      en: "Ordination (PCoA by default) of a chosen distance metric between samples, with a PERMANOVA test against a metadata grouping variable."
      pt: "Ordenação (PCoA por padrão) de uma métrica de distância escolhida entre amostras, com teste PERMANOVA contra uma variável de agrupamento dos metadados."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/beta_diversity.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to color/group samples by and test with PERMANOVA"
          pt: "Coluna de metadados para colorir/agrupar amostras e testar com PERMANOVA"
      - flag: "--ordination_method"
        type: choice
        default: "PCoA"
        enabled: true
        description:
          en: "Ordination method"
          pt: "Método de ordenação"
        choices: ["PCoA", "NMDS", "CAP"]
      - flag: "--distance_method"
        type: choice
        default: "bray"
        enabled: true
        description:
          en: "Distance/dissimilarity metric. unifrac/wunifrac need a real phylogenetic tree (PRISM runs only, when >=3 taxa were detected -- see prism_tree.nwk in the run's output; MAGMA/DOGMA classify taxa by lineage name, not placed ASV sequences, so they never have one) -- picking them without a tree gives a clear error instead of a result."
          pt: "Métrica de distância/dissimilaridade. unifrac/wunifrac exigem uma árvore filogenética real (apenas em execuções do PRISM, quando >=3 táxons foram detectados -- veja prism_tree.nwk na saída da execução; MAGMA/DOGMA classificam táxons por nome de linhagem, não por sequências de ASV posicionadas, então nunca têm uma) -- escolhê-las sem uma árvore retorna um erro claro em vez de um resultado."
        choices: ["bray", "jaccard", "unifrac", "wunifrac"]
      - flag: "--permutations"
        type: int
        default: 999
        enabled: true
        description:
          en: "Number of PERMANOVA permutations"
          pt: "Número de permutações do PERMANOVA"
        min: 99
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed (reproducibility)"
          pt: "Semente aleatória (reprodutibilidade)"
        min: 0

  # --- Composition ---
  - id: taxonomic_composition
    name:
      en: "Taxonomic Composition"
      pt: "Composição Taxonômica"
    description:
      en: "Stacked relative-abundance bar chart per sample, one figure per taxonomic rank, collapsing everything outside the top N taxa into 'Others'."
      pt: "Gráfico de barras empilhadas de abundância relativa por amostra, uma figura por nível taxonômico, agrupando tudo fora dos N táxons mais abundantes em 'Others'."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/taxonomic_composition.R
    parameters:
      - flag: "--rank"
        type: tax_rank
        default: "all"
        include_all: true
        enabled: true
        description:
          en: "Taxonomic rank to plot ('all' generates one figure per rank); options reflect the ranks available in your data"
          pt: "Nível taxonômico a plotar ('all' gera uma figura por nível); as opções refletem os níveis disponíveis nos seus dados"
      - flag: "--top_n"
        type: int
        default: 20
        enabled: true
        description:
          en: "Number of top taxa to show individually before collapsing the rest into 'Others'"
          pt: "Número de táxons mais abundantes a mostrar individualmente antes de agrupar o resto em 'Others'"
        min: 1
        max: 50

  - id: magma_read_qc
    name:
      en: "Read Cleaning (Before vs. After)"
      pt: "Limpeza de Reads (Antes vs. Depois)"
    description:
      en: "Total reads and Q30 quality rate per sample, before and after cleaning -- fastp for short/hybrid samples, NanoPlot for long-read samples, whichever actually ran for that sample's read type."
      pt: "Total de reads e taxa de qualidade Q30 por amostra, antes e depois da limpeza -- fastp para amostras curtas/híbridas, NanoPlot para amostras de leitura longa, o que de fato rodou para o tipo de leitura da amostra."
    applies_to: [magma]
    input_shape: magma_qc
    script: analyses/magma_read_qc.R
    parameters: []

  - id: magma_assembly_quality
    name:
      en: "Assembly Quality"
      pt: "Qualidade da Montagem"
    description:
      en: "N50 and total assembly length per sample from MetaQuast, for the full assembly and the Tiara-filtered prokaryotic subset side by side."
      pt: "N50 e comprimento total da montagem por amostra (MetaQuast), para a montagem completa e o subconjunto procariótico filtrado pelo Tiara, lado a lado."
    applies_to: [magma]
    input_shape: magma_qc
    script: analyses/magma_assembly_quality.R
    parameters: []

  - id: magma_kaiju_taxonomic_composition
    name:
      en: "Taxonomic Composition (Kaiju)"
      pt: "Composição Taxonômica (Kaiju)"
    description:
      en: "Same stacked relative-abundance bar chart as Taxonomic Composition, built from Kaiju's translated-protein classification instead of Kraken2/Bracken's k-mer classification -- Kaiju tends to assign more reads in samples with a lot of taxonomic novelty. Compare against Taxonomic Composition to see where the two classifiers agree."
      pt: "O mesmo gráfico de barras empilhadas da Composição Taxonômica, construído a partir da classificação por proteína traduzida do Kaiju em vez da classificação por k-mer do Kraken2/Bracken -- o Kaiju tende a atribuir mais reads em amostras com muita novidade taxonômica. Compare com Composição Taxonômica para ver onde os dois classificadores concordam."
    applies_to: [magma]
    input_shape: phyloseq_kaiju
    script: analyses/taxonomic_composition.R
    parameters:
      - flag: "--rank"
        type: tax_rank
        default: "all"
        include_all: true
        enabled: true
        description:
          en: "Taxonomic rank to plot ('all' generates one figure per rank); options reflect the ranks available in this run's own reference database"
          pt: "Nível taxonômico a plotar ('all' gera uma figura por nível); as opções refletem os níveis disponíveis na referência usada nesta execução"
      - flag: "--top_n"
        type: int
        default: 20
        enabled: true
        description:
          en: "Number of top taxa to show individually before collapsing the rest into 'Others'"
          pt: "Número de táxons mais abundantes a mostrar individualmente antes de agrupar o resto em 'Outros'"
        min: 1
        max: 50

  - id: magma_classifier_concordance
    name:
      en: "Classifier Concordance (Kraken2 vs. Kaiju)"
      pt: "Concordância entre Classificadores (Kraken2 vs. Kaiju)"
    description:
      en: "Compares Kraken2/Bracken's k-mer classification against Kaiju's translated-protein classification for the same reads: total abundance assigned by each classifier per taxon, and which taxa each one calls that the other doesn't. Agreement between two independent classification methods is itself real evidence, not just a choice between them."
      pt: "Compara a classificação por k-mer do Kraken2/Bracken com a classificação por proteína traduzida do Kaiju para as mesmas reads: abundância total atribuída por cada classificador por táxon, e quais táxons cada um encontra que o outro não encontra. A concordância entre dois métodos de classificação independentes é evidência real por si só, não apenas uma escolha entre eles."
    applies_to: [magma]
    input_shape: phyloseq
    script: analyses/magma_classifier_concordance.R
    parameters:
      - flag: "--top_n"
        type: int
        default: 15
        enabled: true
        description:
          en: "Number of taxa (by combined abundance) to show individually before collapsing the rest into 'Others'"
          pt: "Número de táxons (por abundância combinada) a mostrar individualmente antes de agrupar o resto em 'Outros'"
        min: 1
        max: 40

  - id: core_microbiome
    name:
      en: "Core Microbiome Heatmap"
      pt: "Heatmap do Core Microbiome"
    description:
      en: "Heatmap of taxa present above a minimum relative abundance in a minimum fraction of samples, faceted by a metadata grouping variable."
      pt: "Heatmap dos táxons presentes acima de uma abundância relativa mínima em uma fração mínima das amostras, dividido em painéis por uma variável de agrupamento dos metadados."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/core_microbiome.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to facet the heatmap by"
          pt: "Coluna de metadados para dividir o heatmap em painéis"
      - flag: "--rank"
        type: tax_rank
        default: "Family"
        include_asv: true
        enabled: true
        description:
          en: "Taxonomic rank to aggregate at ('ASV' skips aggregation); options reflect the ranks available in your data"
          pt: "Nível taxonômico para agregação ('ASV' pula a agregação); as opções refletem os níveis disponíveis nos seus dados"
      - flag: "--prevalence"
        type: float
        default: 0.90
        enabled: true
        description:
          en: "Minimum fraction of samples a taxon must appear in to count as 'core'"
          pt: "Fração mínima de amostras em que um táxon deve aparecer para contar como 'core'"
        min: 0.0
        max: 1.0
      - flag: "--min_abundance"
        type: float
        default: 0.001
        enabled: true
        description:
          en: "Minimum relative abundance for a taxon to count as present in a sample"
          pt: "Abundância relativa mínima para um táxon contar como presente em uma amostra"
        min: 0.0
        max: 1.0

  # --- Statistical comparisons ---
  - id: differential_abundance_deseq2
    name:
      en: "Differential Abundance (DESeq2)"
      pt: "Abundância Diferencial (DESeq2)"
    description:
      en: "DESeq2 Wald test between the levels of a metadata grouping variable, filtered to significant biomarkers by adjusted p-value and minimum log2 fold change."
      pt: "Teste de Wald do DESeq2 entre os níveis de uma variável de agrupamento dos metadados, filtrado a biomarcadores significativos por p-valor ajustado e log2 fold change mínimo."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/differential_abundance_deseq2.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.01
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 7
        enabled: true
        description:
          en: "Minimum absolute log2 fold change for a biomarker to be reported"
          pt: "Log2 fold change absoluto mínimo para um biomarcador ser reportado"
        min: 0

  - id: rda_environmental_drivers
    name:
      en: "RDA — Environmental Drivers"
      pt: "RDA — Fatores Ambientais"
    description:
      en: "Redundancy analysis of Hellinger-transformed abundances against every numeric metadata column, with automatic forward selection of the statistically significant drivers."
      pt: "Análise de redundância das abundâncias transformadas por Hellinger contra toda coluna numérica dos metadados, com seleção automática (forward) dos fatores estatisticamente significativos."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/rda_environmental_drivers.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column used only to color sample points (not part of the RDA model itself)"
          pt: "Coluna de metadados usada apenas para colorir os pontos das amostras (não faz parte do modelo RDA em si)"
      - flag: "--permutations"
        type: int
        default: 999
        enabled: true
        description:
          en: "Number of permutations for forward selection and the model significance test"
          pt: "Número de permutações para a seleção forward e o teste de significância do modelo"
        min: 99
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed (reproducibility)"
          pt: "Semente aleatória (reprodutibilidade)"
        min: 0

  - id: cooccurrence_network
    name:
      en: "Co-occurrence Network"
      pt: "Rede de Co-ocorrência"
    description:
      en: "Spearman correlation network of the top N taxa within each group of a metadata variable, thresholded by correlation strength and significance."
      pt: "Rede de correlação de Spearman dos N táxons mais abundantes dentro de cada grupo de uma variável de metadados, filtrada por força de correlação e significância."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/cooccurrence_network.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the groups a separate network is built for"
          pt: "Coluna de metadados que define os grupos para os quais uma rede separada é construída"
      - flag: "--rank"
        type: tax_rank
        default: "Genus"
        enabled: true
        description:
          en: "Taxonomic rank to aggregate at before building the network (options reflect the ranks available in your data)"
          pt: "Nível taxonômico para agregação antes de construir a rede (opções refletem os níveis disponíveis nos seus dados)"
      - flag: "--top_n"
        type: int
        default: 25
        enabled: true
        description:
          en: "Number of top taxa (by abundance) to include in the network"
          pt: "Número de táxons mais abundantes a incluir na rede"
        min: 2
        max: 100
      - flag: "--cor_cutoff"
        type: float
        default: 0.6
        enabled: true
        description:
          en: "Minimum absolute Spearman correlation (rho) for an edge to be kept"
          pt: "Correlação de Spearman (rho) absoluta mínima para uma aresta ser mantida"
        min: 0.0
        max: 1.0
      - flag: "--p_cutoff"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Maximum p-value for an edge to be kept"
          pt: "P-valor máximo para uma aresta ser mantida"
        min: 0.0
        max: 1.0
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed for the network layout (reproducibility)"
          pt: "Semente aleatória para o layout da rede (reprodutibilidade)"
        min: 0

  - id: indicator_species
    name:
      en: "Indicator Species Analysis (IndVal)"
      pt: "Análise de Espécies Indicadoras (IndVal)"
    description:
      en: "Multi-level pattern analysis (indicspecies::multipatt) identifying taxa that significantly indicate a single level of a metadata grouping variable."
      pt: "Análise de padrões multiníveis (indicspecies::multipatt) identificando táxons que indicam significativamente um único nível de uma variável de agrupamento dos metadados."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/indicator_species.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the groups tested as indicator targets"
          pt: "Coluna de metadados que define os grupos testados como alvo de indicação"
      - flag: "--rank"
        type: tax_rank
        default: "Genus"
        enabled: true
        description:
          en: "Taxonomic rank to aggregate at before testing (options reflect the ranks available in your data)"
          pt: "Nível taxonômico para agregação antes do teste (opções refletem os níveis disponíveis nos seus dados)"
      - flag: "--p_cutoff"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Maximum p-value for a taxon to be reported as a significant indicator"
          pt: "P-valor máximo para um táxon ser reportado como indicador significativo"
        min: 0.0
        max: 1.0
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed for the permutation test (reproducibility)"
          pt: "Semente aleatória para o teste de permutação (reprodutibilidade)"
        min: 0

  # --- Set overlap (Venn caps at 4 sets; UpSet is the many-groups alternative) ---
  - id: venn_diagram
    name:
      en: "Venn Diagram — Shared/Unique Taxa"
      pt: "Diagrama de Venn — Táxons Compartilhados/Exclusivos"
    description:
      en: "Venn diagram of taxa present (above a minimum relative abundance) in each level of a metadata grouping variable -- works best with up to 4 groups."
      pt: "Diagrama de Venn dos táxons presentes (acima de uma abundância relativa mínima) em cada nível de uma variável de agrupamento dos metadados -- funciona melhor com até 4 grupos."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/venn_diagram.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the (up to 4) sets compared"
          pt: "Coluna de metadados que define os (até 4) conjuntos comparados"
      - flag: "--rank"
        type: tax_rank
        default: "Genus"
        include_asv: true
        enabled: true
        description:
          en: "Taxonomic rank to aggregate at before comparing sets (options reflect the ranks available in your data)"
          pt: "Nível taxonômico para agregação antes de comparar os conjuntos (opções refletem os níveis disponíveis nos seus dados)"
      - flag: "--min_abundance"
        type: float
        default: 0.0
        enabled: true
        description:
          en: "Minimum relative abundance for a taxon to count as present in a group"
          pt: "Abundância relativa mínima para um táxon contar como presente em um grupo"
        min: 0.0
        max: 1.0

  - id: upset_plot
    name:
      en: "UpSet Plot — Shared/Unique Taxa"
      pt: "Diagrama UpSet — Táxons Compartilhados/Exclusivos"
    description:
      en: "Set-intersection plot of taxa present (above a minimum relative abundance) in each level of a metadata grouping variable -- the alternative to the Venn diagram for more than 4 groups."
      pt: "Gráfico de interseção de conjuntos dos táxons presentes (acima de uma abundância relativa mínima) em cada nível de uma variável de agrupamento dos metadados -- a alternativa ao diagrama de Venn para mais de 4 grupos."
    applies_to: [magma, prism]
    input_shape: phyloseq
    script: analyses/upset_plot.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the sets compared (any number of levels)"
          pt: "Coluna de metadados que define os conjuntos comparados (qualquer número de níveis)"
      - flag: "--rank"
        type: tax_rank
        default: "Genus"
        include_asv: true
        enabled: true
        description:
          en: "Taxonomic rank to aggregate at before comparing sets (options reflect the ranks available in your data)"
          pt: "Nível taxonômico para agregação antes de comparar os conjuntos (opções refletem os níveis disponíveis nos seus dados)"
      - flag: "--min_abundance"
        type: float
        default: 0.0
        enabled: true
        description:
          en: "Minimum relative abundance for a taxon to count as present in a group"
          pt: "Abundância relativa mínima para um táxon contar como presente em um grupo"
        min: 0.0
        max: 1.0

  # =========================================================================
  # DEFINE (bacterial isolate RNA-seq): count_matrix-shaped, standard DESeq2
  # workflow visualizations, real citations logged in notes/Scientific
  # References.md. Own scripts throughout (plots/scripts/analyses/sample_pca.R
  # etc. + plots/scripts/lib/build_count_matrix.R/deseq_helpers.R) -- never
  # shared with MAGMA's phyloseq-shaped scripts above, by design (separate
  # pipelines get separate scripts).
  # =========================================================================
  - id: sample_pca
    name:
      en: "Sample PCA"
      pt: "PCA das Amostras"
    description:
      en: "Principal component analysis of variance-stabilized gene counts, colored by a metadata grouping variable -- the standard first exploratory/QC check before trusting any differential expression result."
      pt: "Análise de componentes principais das contagens gênicas estabilizadas por variância, coloridas por uma variável de agrupamento dos metadados -- a primeira checagem exploratória/QC padrão antes de confiar em qualquer resultado de expressão diferencial."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/sample_pca.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to color samples by"
          pt: "Coluna de metadados para colorir as amostras"

  - id: sample_distance_heatmap
    name:
      en: "Sample Distance Heatmap"
      pt: "Heatmap de Distância entre Amostras"
    description:
      en: "Pairwise Euclidean distance between samples on variance-stabilized counts, hierarchically clustered -- spots outlier samples or unexpected clustering before trusting downstream results."
      pt: "Distância euclidiana par a par entre amostras nas contagens estabilizadas por variância, agrupadas hierarquicamente -- identifica amostras discrepantes ou agrupamentos inesperados antes de confiar em resultados posteriores."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/sample_distance_heatmap.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to group samples by"
          pt: "Coluna de metadados para agrupar as amostras"

  - id: ma_plot
    name:
      en: "MA Plot"
      pt: "Gráfico MA"
    description:
      en: "Mean expression vs. log2 fold change for every tested gene, with shrunk fold-change estimates -- DESeq2's own standard summary of a differential expression comparison."
      pt: "Expressão média vs. log2 fold change para cada gene testado, com estimativas de fold change contraídas (shrunk) -- o resumo padrão do DESeq2 para uma comparação de expressão diferencial."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/ma_plot.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0

  - id: volcano_plot
    name:
      en: "Volcano Plot"
      pt: "Gráfico Vulcão"
    description:
      en: "Log2 fold change vs. -log10 adjusted p-value for every tested gene -- the canonical differential expression result figure, with top hits labeled by gene name."
      pt: "Log2 fold change vs. -log10 do p-valor ajustado para cada gene testado -- a figura canônica de resultado de expressão diferencial, com os principais genes rotulados pelo nome."
