          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference"
          pt: "Nível de group_var a testar contra a referência"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0

  - id: dogma_de_heatmap
    name:
      en: "Differential Gene Family Heatmap"
      pt: "Heatmap de Famílias Gênicas Diferenciais"
    description:
      en: "Heatmap of the top N differentially abundant gene families (variance-stabilized, row z-scored, hierarchically clustered) for a chosen comparison -- standard DESeq2-workflow visualization, adapted to DOGMA's gene-family-aggregated counts."
      pt: "Heatmap das N famílias gênicas mais diferencialmente abundantes (estabilizadas por variância, z-score por linha, agrupadas hierarquicamente) para uma comparação escolhida -- visualização padrão do fluxo de trabalho do DESeq2, adaptada para as contagens agregadas por família gênica do DOGMA."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_de_heatmap.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before testing"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference"
          pt: "Nível de group_var a testar contra a referência"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff to select the top gene families"
          pt: "Limiar de p-valor ajustado (padj) para selecionar as famílias gênicas do topo"
        min: 0.0
        max: 1.0
      - flag: "--top_n"
        type: int
        default: 30
        enabled: true
        description:
          en: "Maximum number of top significant gene families to show"
          pt: "Número máximo de famílias gênicas significativas do topo a mostrar"

  - id: dogma_de_upset
    name:
      en: "Multi-Comparison Functional Overlap (UpSet)"
      pt: "Sobreposição Funcional Multi-Comparação (UpSet)"
    description:
      en: "For every non-reference level of a grouping variable, finds its own up-/down-regulated gene families vs. the same reference, then shows the overlap across all comparisons as two UpSet plots -- including the 'core' gene family list shared by every comparison."
      pt: "Para cada nível não-referência de uma variável de agrupamento, encontra suas próprias famílias gênicas up-/down-reguladas vs. a mesma referência, e mostra a sobreposição entre todas as comparações em dois diagramas UpSet -- incluindo a lista 'core' de famílias gênicas compartilhadas por todas as comparações."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_de_upset.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before testing"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining every condition to compare (needs at least 3 levels: the reference plus 2+ others to overlap)"
          pt: "Coluna de metadados que define cada condição a comparar (precisa de pelo menos 3 níveis: a referência mais 2+ outras para sobrepor)"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var used as the common reference (baseline) for every comparison"
          pt: "Nível de group_var usado como referência (linha de base) comum para todas as comparações"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff to select each comparison's differentially abundant gene families"
          pt: "Limiar de p-valor ajustado (padj) para selecionar as famílias gênicas diferencialmente abundantes de cada comparação"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change to select each comparison's differentially abundant gene families"
          pt: "Log2 fold change absoluto mínimo para selecionar as famílias gênicas diferencialmente abundantes de cada comparação"
        min: 0

  - id: dogma_functional_diversity
    name:
      en: "Functional Diversity"
      pt: "Diversidade Funcional"
    description:
      en: "Observed richness, Chao1, ACE, Shannon, Simpson, and Pielou's evenness of gene-family- (or taxon-, via --annotation_column) aggregated counts per sample, grouped and Kruskal-Wallis-tested by a chosen metadata variable -- answers whether the community's overall functional/taxonomic diversity differs between conditions, complementing Functional Composition/Differential Abundance's gene-family-specific view. DOGMA profiles a whole community (like MAGMA/PRISM), not one isolate (like DEFINE), so this reuses the same community-ecology engine."
      pt: "Riqueza observada, Chao1, ACE, Shannon, Simpson e equitabilidade de Pielou das contagens agregadas por família gênica (ou táxon, via --annotation_column) por amostra, agrupados e testados por Kruskal-Wallis segundo uma variável de metadados escolhida -- responde se a diversidade funcional/taxonômica geral da comunidade difere entre condições, complementando a visão específica por família gênica da Composição/Abundância Diferencial Funcional. O DOGMA perfila uma comunidade inteira (como MAGMA/PRISM), não um isolado (como o DEFINE), então isso reaproveita o mesmo motor de ecologia de comunidade."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_functional_diversity.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before computing diversity"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de calcular a diversidade"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to group samples by (also used for the Kruskal-Wallis test)"
          pt: "Coluna de metadados para agrupar as amostras (também usada no teste de Kruskal-Wallis)"
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed for rarefaction (reproducibility)"
          pt: "Semente aleatória para a rarefação (reprodutibilidade)"
        min: 0

  - id: dogma_functional_beta_diversity
    name:
      en: "Functional Beta Diversity"
      pt: "Beta Diversidade Funcional"
    description:
      en: "Ordination (PCoA by default) of a chosen distance metric between samples on gene-family- (or taxon-, via --annotation_column) aggregated counts, with a PERMANOVA test against a metadata grouping variable -- answers whether the community's overall functional/taxonomic profile differs between conditions."
      pt: "Ordenação (PCoA por padrão) de uma métrica de distância escolhida entre amostras, sobre contagens agregadas por família gênica (ou táxon, via --annotation_column), com teste PERMANOVA contra uma variável de agrupamento dos metadados -- responde se o perfil funcional/taxonômico geral da comunidade difere entre condições."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_functional_beta_diversity.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before computing distances"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de calcular as distâncias"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to color/group samples by and test with PERMANOVA"
          pt: "Coluna de metadados para colorir/agrupar amostras e testar com PERMANOVA"
      - flag: "--ordination_method"
        type: choice
        default: "PCoA"
        enabled: true
        description:
          en: "Ordination method"
          pt: "Método de ordenação"
        choices: ["PCoA", "NMDS", "CAP"]
      - flag: "--distance_method"
        type: choice
        default: "bray"
        enabled: true
        description:
          en: "Distance/dissimilarity metric (no unifrac/wunifrac here -- there is no real phylogeny between arbitrary functional categories to build a tree from)"
          pt: "Métrica de distância/dissimilaridade (sem unifrac/wunifrac aqui -- não existe uma filogenia real entre categorias funcionais arbitrárias para construir uma árvore)"
        choices: ["bray", "jaccard"]
      - flag: "--permutations"
        type: int
        default: 999
        enabled: true
        description:
          en: "Number of PERMANOVA permutations"
          pt: "Número de permutações do PERMANOVA"
        min: 99
      - flag: "--seed"
        type: int
        default: 123
        enabled: true
        description:
          en: "Random seed for rarefaction (reproducibility)"
          pt: "Semente aleatória para a rarefação (reprodutibilidade)"
        min: 0

  # =========================================================================
  # SIGMA (single isolate genome assembly): sigma_genomes-shaped. Unlike
  # every other pipeline here, SIGMA has NO cross-sample table anywhere in
  # its own real output at all -- ~8 incompatible per-tool-per-genome
  # formats (QUAST, CheckM2, GTDB-Tk, CoverM, MLST, AMRFinderPlus, ABRicate),
  # confirmed by reading each tool's real installed source/output before
  # writing lib/build_sigma_table.R's merge (see notes/SIGMA.md). A run can
  # assemble many genomes at once, so the user's own explicit design
  # requirement applies here: analyses need a real way to pick WHICH genome
  # to work with -- --genome uses PlotParam's new "sample" type (a real
  # dropdown of this run's actual genome names, not a metadata column the
  # user picked -- see plot_loaded_data.dart's own docstring).
  # =========================================================================
  - id: magma_mag_summary
    name:
      en: "MAG Summary"
      pt: "Resumo dos MAGs"
    description:
      en: "Per-MAG report card for the genomes you pick out of the run: CheckM2 completeness and contamination, the MIMAG quality tier with the rRNA and tRNA evidence behind it, genome size, GTDB-Tk lineage, abundance in each sample, and AMR/virulence hits. Several MAGs can be shown side by side."
      pt: "Ficha por MAG dos genomas que você selecionar da execução: completude e contaminação (CheckM2), o nível de qualidade MIMAG com a evidência de rRNA e tRNA por trás dele, tamanho do genoma, linhagem GTDB-Tk, abundância em cada amostra e hits de resistência/virulência. Vários MAGs podem ser mostrados lado a lado."
    applies_to: [magma]
    input_shape: magma_mags
    script: analyses/magma_mag_summary.R
    parameters:
      - flag: "--mags"
        type: samples
        enabled: true
        default: ""
        description:
          en: "Which MAGs from this run to show, one panel each"
          pt: "Quais MAGs desta execução mostrar, um painel para cada"

  - id: sigma_genome_summary
    name:
      en: "Genome Summary"
      pt: "Resumo do Genoma"
    description:
      en: "Assembly, quality, taxonomy, coverage and typing statistics for a single selected genome from this run, plus its own AMR/virulence gene hits -- the per-genome 'report card' a cross-genome comparison can't give on its own."
      pt: "Estatísticas de montagem, qualidade, taxonomia, cobertura e tipagem de um único genoma selecionado desta execução, mais seus próprios hits de genes de resistência/virulência -- o 'boletim' por genoma que uma comparação entre genomas não consegue dar sozinha."
    applies_to: [sigma]
    input_shape: sigma_genomes
    script: analyses/sigma_genome_summary.R
    parameters:
      - flag: "--genome"
        type: sample
        enabled: true
        description:
          en: "Which of this run's assembled genomes to show"
          pt: "Qual dos genomas montados nesta execução mostrar"

  - id: sigma_genome_quality_overview
    name:
      en: "Genome Quality Overview"
      pt: "Visão Geral de Qualidade dos Genomas"
    description:
      en: "CheckM2 completeness vs. contamination for every genome in the run at once, point size by assembly N50, with the real MIMAG high-quality threshold (Bowers et al. 2017: >=90% complete, <=5% contamination) drawn as a reference region -- 'are all my genomes actually good enough to trust', complementing Genome Summary's single-genome detail."
      pt: "Completude vs. contaminação (CheckM2) de todos os genomas da execução de uma vez, tamanho do ponto pelo N50 da montagem, com o limiar real de alta qualidade MIMAG (Bowers et al. 2017: >=90% completo, <=5% contaminação) desenhado como região de referência -- 'meus genomas são bons o suficiente para confiar', complementando o detalhe por genoma do Resumo do Genoma."
    applies_to: [sigma]
    input_shape: sigma_genomes
    script: analyses/sigma_genome_quality_overview.R
    parameters:
      - flag: "--group_var"
        type: column
        default: ""
        enabled: true
        description:
          en: "Optional column to color genomes by -- SIGMA's own taxonomy (gtdbtk_genus, ...) and typing (mlst_scheme, mlst_st) columns are available automatically, no metadata.tsv required, alongside any real metadata you provide"
          pt: "Coluna opcional para colorir os genomas -- as próprias colunas de taxonomia (gtdbtk_genus, ...) e tipagem (mlst_scheme, mlst_st) do SIGMA já estão disponíveis automaticamente, sem precisar de metadata.tsv, além de qualquer metadado real que você forneça"

  - id: sigma_amr_heatmap
    name:
      en: "AMR/Virulence Gene Heatmap"
      pt: "Heatmap de Genes de Resistência/Virulência"
    description:
      en: "Presence/absence of AMR and virulence genes (AMRFinderPlus + ABRicate's NCBI/CARD/VFDB databases) across every genome in the run, hierarchically clustered on both axes -- standard comparative genomics/epidemiology output."
      pt: "Presença/ausência de genes de resistência e virulência (AMRFinderPlus + bancos NCBI/CARD/VFDB do ABRicate) em todos os genomas da execução, agrupados hierarquicamente nos dois eixos -- saída padrão de genômica comparativa/epidemiologia."
    applies_to: [sigma]
    input_shape: sigma_genomes
    script: analyses/sigma_amr_heatmap.R
    parameters:
      - flag: "--source_filter"
        type: choice
        default: "all"
        enabled: true
        description:
          en: "Restrict to one gene-hit source, or show all combined"
          pt: "Restringir a uma fonte de hits de genes, ou mostrar todas combinadas"
        choices: ["all", "amrfinder", "abricate_ncbi", "abricate_card", "abricate_vfdb"]
      - flag: "--top_n"
        type: int
        default: 40
        enabled: true
        description:
          en: "Maximum number of genes to show, ranked by how many genomes carry them"
          pt: "Número máximo de genes a mostrar, ranqueados por quantos genomas os carregam"
