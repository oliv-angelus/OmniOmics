        max: 50

  - id: de_heatmap
    name:
      en: "DE Genes Heatmap"
      pt: "Heatmap de Genes Diferencialmente Expressos"
    description:
      en: "Heatmap of the top significant genes (variance-stabilized, row z-scored), hierarchically clustered on both axes."
      pt: "Heatmap dos principais genes significativos (estabilizados por variância, com z-score por linha), agrupados hierarquicamente nos dois eixos."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/de_heatmap.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for a gene to be considered"
          pt: "Limiar de p-valor ajustado (padj) para um gene ser considerado"
        min: 0.0
        max: 1.0
      - flag: "--top_n"
        type: int
        default: 30
        enabled: true
        description:
          en: "Maximum number of top genes (by padj) to show"
          pt: "Número máximo de genes principais (por padj) a mostrar"
        min: 2
        max: 200

  - id: functional_enrichment
    name:
      en: "Functional Enrichment"
      pt: "Enriquecimento Funcional"
    description:
      en: "Over-representation analysis of the differentially expressed genes against COG categories, GO terms, or KEGG pathways already annotated by DEFINE's own eggNOG-mapper step -- no external database lookup needed."
      pt: "Análise de sobre-representação dos genes diferencialmente expressos contra categorias COG, termos GO ou vias KEGG já anotados pela própria etapa eggNOG-mapper do DEFINE -- sem necessidade de consulta a banco de dados externo."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/functional_enrichment.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff to select the differentially expressed gene set"
          pt: "Limiar de p-valor ajustado (padj) para selecionar o conjunto de genes diferencialmente expressos"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change to select the differentially expressed gene set"
          pt: "Log2 fold change absoluto mínimo para selecionar o conjunto de genes diferencialmente expressos"
        min: 0
      - flag: "--term_source"
        type: choice
        default: "COG_category"
        enabled: true
        description:
