    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before testing"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference"
