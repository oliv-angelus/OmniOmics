  # =========================================================================
  # DEFINE (bacterial isolate RNA-seq): count_matrix-shaped, standard DESeq2
  # workflow visualizations, real citations logged in notes/Scientific
  # References.md. Own scripts throughout (plots/scripts/analyses/sample_pca.R
  # etc. + plots/scripts/lib/build_count_matrix.R/deseq_helpers.R) -- never
  # shared with MAGMA's phyloseq-shaped scripts above, by design (separate
  # pipelines get separate scripts).
  # =========================================================================
  - id: sample_pca
    name:
      en: "Sample PCA"
      pt: "PCA das Amostras"
    description:
      en: "Principal component analysis of variance-stabilized gene counts, colored by a metadata grouping variable -- the standard first exploratory/QC check before trusting any differential expression result."
      pt: "Análise de componentes principais das contagens gênicas estabilizadas por variância, coloridas por uma variável de agrupamento dos metadados -- a primeira checagem exploratória/QC padrão antes de confiar em qualquer resultado de expressão diferencial."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/sample_pca.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to color samples by"
          pt: "Coluna de metadados para colorir as amostras"

  - id: sample_distance_heatmap
    name:
      en: "Sample Distance Heatmap"
      pt: "Heatmap de Distância entre Amostras"
    description:
      en: "Pairwise Euclidean distance between samples on variance-stabilized counts, hierarchically clustered -- spots outlier samples or unexpected clustering before trusting downstream results."
      pt: "Distância euclidiana par a par entre amostras nas contagens estabilizadas por variância, agrupadas hierarquicamente -- identifica amostras discrepantes ou agrupamentos inesperados antes de confiar em resultados posteriores."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/sample_distance_heatmap.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to group samples by"
          pt: "Coluna de metadados para agrupar as amostras"

  - id: ma_plot
    name:
      en: "MA Plot"
      pt: "Gráfico MA"
    description:
      en: "Mean expression vs. log2 fold change for every tested gene, with shrunk fold-change estimates -- DESeq2's own standard summary of a differential expression comparison."
      pt: "Expressão média vs. log2 fold change para cada gene testado, com estimativas de fold change contraídas (shrunk) -- o resumo padrão do DESeq2 para uma comparação de expressão diferencial."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/ma_plot.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0

  - id: volcano_plot
    name:
      en: "Volcano Plot"
      pt: "Gráfico Vulcão"
    description:
      en: "Log2 fold change vs. -log10 adjusted p-value for every tested gene -- the canonical differential expression result figure, with top hits labeled by gene name."
      pt: "Log2 fold change vs. -log10 do p-valor ajustado para cada gene testado -- a figura canônica de resultado de expressão diferencial, com os principais genes rotulados pelo nome."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/volcano_plot.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change for a gene to count as significant"
          pt: "Log2 fold change absoluto mínimo para um gene contar como significativo"
        min: 0
      - flag: "--label_top_n"
        type: int
        default: 15
        enabled: true
        description:
          en: "Number of top significant genes to label by name"
          pt: "Número de genes significativos a rotular pelo nome"
        min: 0
        max: 50

  - id: de_heatmap
    name:
      en: "DE Genes Heatmap"
      pt: "Heatmap de Genes Diferencialmente Expressos"
    description:
      en: "Heatmap of the top significant genes (variance-stabilized, row z-scored), hierarchically clustered on both axes."
      pt: "Heatmap dos principais genes significativos (estabilizados por variância, com z-score por linha), agrupados hierarquicamente nos dois eixos."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/de_heatmap.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for a gene to be considered"
          pt: "Limiar de p-valor ajustado (padj) para um gene ser considerado"
        min: 0.0
        max: 1.0
      - flag: "--top_n"
        type: int
        default: 30
        enabled: true
        description:
          en: "Maximum number of top genes (by padj) to show"
          pt: "Número máximo de genes principais (por padj) a mostrar"
        min: 2
        max: 200

  - id: functional_enrichment
    name:
      en: "Functional Enrichment"
      pt: "Enriquecimento Funcional"
    description:
      en: "Over-representation analysis of the differentially expressed genes against COG categories, GO terms, or KEGG pathways already annotated by DEFINE's own eggNOG-mapper step -- no external database lookup needed."
      pt: "Análise de sobre-representação dos genes diferencialmente expressos contra categorias COG, termos GO ou vias KEGG já anotados pela própria etapa eggNOG-mapper do DEFINE -- sem necessidade de consulta a banco de dados externo."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/functional_enrichment.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff to select the differentially expressed gene set"
          pt: "Limiar de p-valor ajustado (padj) para selecionar o conjunto de genes diferencialmente expressos"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change to select the differentially expressed gene set"
          pt: "Log2 fold change absoluto mínimo para selecionar o conjunto de genes diferencialmente expressos"
        min: 0
      - flag: "--term_source"
        type: choice
        default: "COG_category"
        enabled: true
        description:
          en: "Functional annotation to test enrichment against"
          pt: "Anotação funcional contra a qual testar o enriquecimento"
        choices: ["COG_category", "GOs", "KEGG_Pathway"]
      - flag: "--p_cutoff"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Maximum adjusted p-value for a term to be reported as enriched"
          pt: "P-valor ajustado máximo para um termo ser reportado como enriquecido"
        min: 0.0
        max: 1.0

  - id: de_upset
    name:
      en: "Multi-Comparison DE Overlap (UpSet)"
      pt: "Sobreposição de DE Multi-Comparação (UpSet)"
    description:
      en: "For every non-reference level of a grouping variable, finds its own up-/down-regulated genes vs. the same reference, then shows the overlap across all comparisons as two UpSet plots -- including the 'core' gene list shared by every comparison."
      pt: "Para cada nível não-referência de uma variável de agrupamento, encontra seus próprios genes up-/down-regulados vs. a mesma referência, e mostra a sobreposição entre todas as comparações em dois diagramas UpSet -- incluindo a lista 'core' de genes compartilhados por todas as comparações."
    applies_to: [define]
    input_shape: count_matrix
    script: analyses/de_upset.R
    parameters:
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining every condition to compare (needs at least 3 levels: the reference plus 2+ others to overlap)"
          pt: "Coluna de metadados que define cada condição a comparar (precisa de pelo menos 3 níveis: a referência mais 2+ outras para sobrepor)"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var used as the common reference (baseline) for every comparison"
          pt: "Nível de group_var usado como referência (linha de base) comum para todas as comparações"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff to select each comparison's differentially expressed genes"
          pt: "Limiar de p-valor ajustado (padj) para selecionar os genes diferencialmente expressos de cada comparação"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change to select each comparison's differentially expressed genes"
          pt: "Log2 fold change absoluto mínimo para selecionar os genes diferencialmente expressos de cada comparação"
        min: 0

  # =========================================================================
  # DOGMA (metatranscriptomics): dogma_annotated-shaped. DOGMA's own pipeline
  # deliberately stops at ~10 separate per-tool tables per sample x domain,
  # never merged (see notes/DOGMA.md's "deliberately NOT one merged table"
  # decision) -- these two analyses ARE that merge + the statistics DOGMA's
  # own scope explicitly defers to here. plots/scripts/lib/build_dogma_table.R
  # does the real per-ORF join (TransDecoder spine, LEFT JOIN every
  # annotation table); own scripts throughout, never shared with MAGMA/
  # PRISM's phyloseq scripts or DEFINE's single-reference count_matrix ones
  # (DOGMA has no shared gene-ID space across samples at all -- see that
  # file's own header for why a third shape was unavoidable).
  # =========================================================================
  - id: dogma_functional_composition
    name:
      en: "Functional Composition"
      pt: "Composição Funcional"
    description:
      en: "Stacked relative-abundance bar chart per sample, by a chosen functional/taxonomic annotation category (e.g. KEGG ortholog, COG category, a cycling-gene family) -- the functional analogue of taxonomic composition, since DOGMA's own per-sample de novo assemblies have no shared taxon/gene ID to plot by directly."
      pt: "Gráfico de barras empilhadas de abundância relativa por amostra, por uma categoria de anotação funcional/taxonômica escolhida (ex: ortólogo KEGG, categoria COG, uma família de genes de ciclagem) -- o análogo funcional da composição taxonômica, já que as montagens de novo por amostra do DOGMA não têm um ID de táxon/gene compartilhado para plotar diretamente."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_functional_composition.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to group reads by. Only columns from tools actually active in this run have real data -- picking one that wasn't run gives a clear error naming what's actually available. eggNOG (KEGG_ko/COG_category) is the only always-on default annotator; the rest are DOGMA's optional soil/sediment-cycling extras."
          pt: "Qual categoria de qual tabela de anotação usar para agrupar as leituras. Só colunas de ferramentas realmente ativas nesta execução têm dados reais -- escolher uma que não rodou retorna um erro claro indicando o que está disponível. eggNOG (KEGG_ko/COG_category) é o único anotador padrão sempre ativo; o resto são os extras opcionais de ciclagem do solo/sedimento do DOGMA."
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--top_n"
        type: int
        default: 20
        enabled: true
        description:
          en: "Number of top gene families to show individually before collapsing the rest into 'Others'"
          pt: "Número de famílias gênicas mais abundantes a mostrar individualmente antes de agrupar o resto em 'Others'"

  - id: dogma_functional_differential
    name:
      en: "Functional Differential Abundance"
      pt: "Abundância Diferencial Funcional"
    description:
      en: "DESeq2 differential-abundance test between two metadata groups, on read counts aggregated by a chosen functional annotation category -- the statistics the DOGMA pipeline itself deliberately stops short of. Aggregating by shared functional vocabulary, rather than raw per-sample transcript/ORF IDs, is what makes cross-sample comparison possible here -- the same approach CoMW uses."
      pt: "Teste de abundância diferencial via DESeq2 entre dois grupos de metadados, sobre contagens de leituras agregadas por uma categoria de anotação funcional escolhida -- a estatística que o próprio pipeline do DOGMA deliberadamente não faz. A agregação por vocabulário funcional compartilhado, em vez do ID bruto de transcrito/ORF por amostra, é o que torna a comparação entre amostras possível aqui -- a mesma abordagem usada pelo CoMW."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_functional_differential.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before testing. Same availability caveat as Functional Composition's."
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar. Mesma ressalva de disponibilidade da Composição Funcional."
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference (which condition this comparison is actually about)"
          pt: "Nível de group_var a testar contra a referência (qual condição esta comparação realmente compara)"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0
      - flag: "--min_lfc"
        type: float
        default: 1
        enabled: true
        description:
          en: "Minimum absolute log2 fold change for significance"
          pt: "Log2 fold change absoluto mínimo para significância"
        min: 0
      - flag: "--label_top_n"
        type: int
        default: 15
        enabled: true
        description:
          en: "Number of top significant gene families to label on the plot"
          pt: "Número de famílias gênicas significativas mais importantes a rotular no gráfico"

  - id: dogma_sample_pca
    name:
      en: "Sample PCA (Functional)"
      pt: "PCA das Amostras (Funcional)"
    description:
      en: "Principal component analysis of variance-stabilized, gene-family-aggregated counts, colored by a metadata grouping variable -- the standard first exploratory/QC check before trusting any differential-abundance result, adapted for DOGMA's per-sample assemblies."
      pt: "Análise de componentes principais das contagens agregadas por família gênica e estabilizadas por variância, coloridas por uma variável de agrupamento dos metadados -- a primeira checagem exploratória/QC padrão antes de confiar em qualquer resultado de abundância diferencial, adaptada para as montagens por amostra do DOGMA."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_sample_pca.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before computing PCA"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de calcular o PCA"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to color samples by"
          pt: "Coluna de metadados para colorir as amostras"

  - id: dogma_sample_distance_heatmap
    name:
      en: "Sample Distance Heatmap (Functional)"
      pt: "Heatmap de Distância entre Amostras (Funcional)"
    description:
      en: "Pairwise Euclidean distance between samples on variance-stabilized, gene-family-aggregated counts, hierarchically clustered -- spots outlier samples or unexpected clustering before trusting downstream results."
      pt: "Distância euclidiana par a par entre amostras nas contagens agregadas por família gênica e estabilizadas por variância, agrupadas hierarquicamente -- identifica amostras discrepantes ou agrupamentos inesperados antes de confiar em resultados posteriores."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_sample_distance_heatmap.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before computing distances"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de calcular as distâncias"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column to group samples by"
          pt: "Coluna de metadados para agrupar as amostras"

  - id: dogma_ma_plot
    name:
      en: "MA Plot (Functional)"
      pt: "Gráfico MA (Funcional)"
    description:
      en: "Mean normalized abundance vs. shrunk log2 fold change for every tested gene family -- DESeq2's own standard differential-abundance result summary, adapted to DOGMA's gene-family-aggregated counts."
      pt: "Abundância normalizada média vs. log2 fold change encolhido para cada família gênica testada -- o resumo padrão de resultado de abundância diferencial do DESeq2, adaptado para as contagens agregadas por família gênica do DOGMA."
    applies_to: [dogma]
    input_shape: dogma_annotated
    script: analyses/dogma_ma_plot.R
    parameters:
      - flag: "--annotation_column"
        type: choice
        default: "eggnog_KEGG_ko"
        enabled: true
        description:
          en: "Which annotation table's category to aggregate read counts by before testing"
          pt: "Qual categoria de qual tabela de anotação usar para agregar as contagens de leituras antes de testar"
        choices: ["eggnog_KEGG_ko", "eggnog_COG_category", "eggnog_KEGG_Pathway", "eggnog_Preferred_name",
                  "cazy_dbCAN_hmm", "cazy_Substrate", "ncycdb_gene", "scycdb_gene", "mcycdb_gene",
                  "canthyd_query_name", "fegenie_category", "fegenie_HMM",
                  "catbat_lineage", "eukulele_classification", "magma_xref_taxonomy"]
      - flag: "--group_var"
        type: column
        enabled: true
        description:
          en: "Metadata column defining the two (or more) groups to compare"
          pt: "Coluna de metadados que define os dois (ou mais) grupos a comparar"
      - flag: "--reference_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to use as the reference (baseline) for the comparison"
          pt: "Nível de group_var a usar como referência (linha de base) para a comparação"
      - flag: "--test_group"
        type: level
        depends_on: "--group_var"
        enabled: true
        description:
          en: "Level of group_var to test against the reference"
          pt: "Nível de group_var a testar contra a referência"
      - flag: "--alpha"
        type: float
        default: 0.05
        enabled: true
        description:
          en: "Adjusted p-value (padj) cutoff for significance"
          pt: "Limiar de p-valor ajustado (padj) para significância"
        min: 0.0
        max: 1.0

  - id: dogma_de_heatmap
    name:
      en: "Differential Gene Family Heatmap"
      pt: "Heatmap de Famílias Gênicas Diferenciais"
    description:
      en: "Heatmap of the top N differentially abundant gene families (variance-stabilized, row z-scored, hierarchically clustered) for a chosen comparison -- standard DESeq2-workflow visualization, adapted to DOGMA's gene-family-aggregated counts."
      pt: "Heatmap das N famílias gênicas mais diferencialmente abundantes (estabilizadas por variância, z-score por linha, agrupadas hierarquicamente) para uma comparação escolhida -- visualização padrão do fluxo de trabalho do DESeq2, adaptada para as contagens agregadas por família gênica do DOGMA."
