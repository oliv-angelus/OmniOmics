    "trinity": {
      "name": "Trinity",
      "description": {
        "en": "De novo transcriptome assembler for short reads -- part of the multi-assembler ensemble; deduplicated together with the others by the Transcript set (MMseqs2) step",
        "pt": "Montador de transcriptoma de novo para reads curtas -- parte do ensemble de montadores; deduplicado junto com os demais pela etapa Conjunto de transcritos (MMseqs2)"
      },
      "citation": [
        {
          "text": "Grabherr MG, Haas BJ, Yassour M, et al. Full-length transcriptome assembly from RNA-seq data without a reference genome. Nature Biotechnology. 2011;29(7):644-652.",
          "doi": "10.1038/nbt.1883"
