    "transcript_set": {
      "name": "Transcript set (MMseqs2)",
      "description": {
        "en": "Pools the active assemblers' transcripts and deduplicates them with a two-step MMseqs2 clustering (100% identity, then 98%, per PMC9983209) into a single non-redundant \"MAD\" (multi-assembler-deduplicated) transcript set -- the input for downstream ORF calling/annotation/quantification (Phase 2)",
        "pt": "Reúne os transcritos dos montadores ativos e os deduplica com uma clusterização MMseqs2 em duas etapas (100% de identidade, depois 98%, conforme PMC9983209) em um único conjunto não redundante \"MAD\" (deduplicado de múltiplos montadores) -- a entrada para chamada de ORFs/anotação/quantificação a jusante (Fase 2)"
      },
      "citation": [
        {
          "text": "Steinegger M, Söding J. MMseqs2 enables sensitive protein sequence searching for the analysis of massive data sets. Nature Biotechnology. 2017;35(11):1026-1028.",
          "doi": "10.1038/nbt.3988"
        },
        {
          "text": "Steinegger M, Söding J. Clustering huge protein sequence sets in linear time. Nature Communications. 2018;9:2542.",
          "doi": "10.1038/s41467-018-04964-5"
        }
      ],
      "category": "Assembly",
      "read_type": "all",
      "flags": [],
      "requires": [
        {
          "tools": [
            "rnaspades",
            "megahit",
            "trinity"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "transcript_set"
      ]
    },
    "transdecoder": {
      "name": "TransDecoder",
