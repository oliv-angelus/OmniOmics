{
  "id": "dogma",
  "name": "DOGMA",
  "description": "Diversity Of Gene expression -- Metatranscriptome Analysis",
  "category": "metatranscriptomics",
  "tags": [
    "prokaryote",
    "eukaryote",
    "community"
  ],
  "icon": "assets/pipeline_icons/dogma.png",
  "snakefile": "Snakefile",
  "categories": [
    "QC & rRNA Removal",
    "Contamination Screening",
    "Assembly",
    "ORF Calling",
    "Gene Prediction & Annotation",
    "Taxonomic Assignment",
    "Quantification"
  ],
  "sample_sheet": {
    "columns": [
      "sample",
      "read_type",
      "fq1",
      "fq2",
      "fq_long"
    ],
    "read_type_values": [
      "short",
      "long",
      "hybrid"
    ],
    "input_dirs": [
      {
        "key": "short_reads_dir",
        "label": "Pasta de reads curtas (RNA)"
      },
      {
        "key": "long_reads_dir",
        "label": "Pasta de reads longas (RNA)"
      },
      {
        "key": "magma_run_dir",
        "label": "Run pareado do MAGMA (opcional)",
        "toggle": true,
        "config_key": "magma_run"
      }
    ]
  },
  "long_read_platforms": [
    {
      "id": "nano_raw",
      "label": "Nanopore (raw)",
      "flye_flag": "--nano-raw",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "nano_hq",
      "label": "Nanopore (HQ / Guppy5+ SUP, Q20+)",
      "flye_flag": "--nano-hq",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "pacbio_raw",
      "label": "PacBio (CLR)",
      "flye_flag": "--pacbio-raw",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-pb"
    },
    {
      "id": "pacbio_hifi",
      "label": "PacBio (HiFi)",
      "flye_flag": "--pacbio-hifi",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-hifi"
    }
  ],
  "default_long_read_platform": "nano_hq",
  "tools": {
    "fastp": {
      "name": "fastp",
      "description": {
        "en": "Fast all-in-one FASTQ preprocessor for short reads",
        "pt": "Pré-processador FASTQ rápido e completo para reads curtas"
      },
      "citation": [
        {
          "text": "Chen S, Zhou Y, Chen Y, Gu J. fastp: an ultra-fast all-in-one FASTQ preprocessor. Bioinformatics. 2018;34(17):i884-i890.",
          "doi": "10.1093/bioinformatics/bty560"
        }
      ],
      "category": "QC & rRNA Removal",
      "read_type": "short",
      "flags": [
        {
          "flag": "--qualified_quality_phred",
          "type": "int",
          "default": 30,
          "enabled": true,
          "description": {
            "en": "Minimum Phred quality score for a base to be considered qualified",
            "pt": "Escore de qualidade Phred mínimo para uma base ser considerada qualificada"
          },
          "min": 0,
          "max": 40
        },
        {
          "flag": "--length_required",
          "type": "int",
          "default": 50,
          "enabled": true,
          "description": {
            "en": "Minimum read length after trimming (bp)",
            "pt": "Comprimento mínimo da read após o trimming (pb)"
          },
          "min": 1
        },
        {
          "flag": "--trim_front1",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Bases to trim from the 5' end of read 1",
            "pt": "Bases a cortar da extremidade 5' da read 1"
          },
          "min": 0
        },
        {
          "flag": "--trim_front2",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Bases to trim from the 5' end of read 2",
            "pt": "Bases a cortar da extremidade 5' da read 2"
          },
          "min": 0
        }
      ],
      "requires": [],
      "rule_names": [
        "fastp"
      ]
    },
    "filtlong": {
      "name": "Filtlong",
      "description": {
        "en": "Quality filtering for long reads (Nanopore/PacBio)",
        "pt": "Filtragem de qualidade para reads longas (Nanopore/PacBio)"
      },
      "citation": [
        {
          "text": "Wick RR. Filtlong [software]. https://github.com/rrwick/Filtlong",
          "doi": null
        }
      ],
      "category": "QC & rRNA Removal",
      "read_type": "long",
      "flags": [
        {
          "flag": "--min_length",
          "type": "int",
          "default": 500,
          "enabled": true,
          "description": {
            "en": "Minimum read length to keep (bp)",
            "pt": "Comprimento mínimo da read a manter (pb)"
          },
          "min": 1
        },
        {
          "flag": "--keep_percent",
          "type": "float",
          "default": 90.0,
          "enabled": true,
          "description": {
            "en": "Keep only the best X% of bases by quality",
            "pt": "Mantém apenas os X% melhores das bases por qualidade"
          },
          "min": 1.0,
          "max": 100.0
        }
      ],
      "requires": [],
      "rule_names": [
        "filtlong"
      ]
    },
    "ribodetector": {
      "name": "riboDetector",
      "description": {
        "en": "Removes ribosomal RNA reads from the clean reads -- most of the RNA in a total-RNA extraction is rRNA, not mRNA, so this runs right after QC and before anything else",
        "pt": "Remove reads de RNA ribossômico das reads limpas -- a maior parte do RNA em uma extração de RNA total é rRNA, não mRNA, então isso roda logo após o QC e antes de qualquer outra etapa"
      },
      "citation": [
        {
          "text": "Deng ZL, Münch PC, Mreches R, McHardy AC. Rapid and accurate identification of ribosomal RNA sequences via deep learning. Nucleic Acids Research. 2022;50(10):e60.",
          "doi": "10.1093/nar/gkac112"
        }
      ],
      "category": "QC & rRNA Removal",
      "read_type": "all",
      "flags": [
        {
          "flag": "-e",
          "type": "choice",
          "default": "norrna",
          "enabled": true,
          "description": {
            "en": "Which classification to prioritize for paired reads",
            "pt": "Qual classificação priorizar para reads paired-end"
          },
          "choices": [
            "norrna",
            "rrna",
            "both",
            "none"
          ]
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp",
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "ribodetector_short",
        "ribodetector_long"
      ]
    },
    "kraken2": {
      "name": "Kraken2",
      "description": {
        "en": "Taxonomic screening of the rRNA-depleted reads -- who's active, at a glance",
        "pt": "Triagem taxonômica das reads depletadas de rRNA -- quem está ativo, num relance"
      },
      "citation": [
        {
          "text": "Wood DE, Lu J, Langmead B. Improved metagenomic analysis with Kraken 2. Genome Biology. 2019;20:257.",
          "doi": "10.1186/s13059-019-1891-0"
        }
      ],
      "category": "Contamination Screening",
      "read_type": "all",
      "flags": [
        {
          "flag": "--confidence",
          "type": "float",
          "default": 0.05,
          "enabled": true,
          "description": {
            "en": "Confidence score threshold (0-1); higher values increase precision",
            "pt": "Limiar de escore de confiança (0-1); valores maiores aumentam a precisão"
          },
          "min": 0.0,
          "max": 1.0
        }
      ],
      "requires": [
        {
          "tools": [
            "ribodetector"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kraken2"
      ]
    },
    "kaiju": {
      "name": "Kaiju",
      "description": {
        "en": "Protein-level taxonomic screening -- independent alternative or complement to Kraken2",
        "pt": "Triagem taxonômica em nível de proteína -- alternativa ou complemento independente ao Kraken2"
      },
      "citation": [
        {
          "text": "Menzel P, Ng KL, Krogh A. Fast and sensitive taxonomic classification for metagenomics with Kaiju. Nature Communications. 2016;7:11257.",
          "doi": "10.1038/ncomms11257"
        }
      ],
      "category": "Contamination Screening",
      "read_type": "all",
      "flags": [
        {
          "flag": "-a",
          "type": "choice",
          "default": "greedy",
          "enabled": false,
          "description": {
            "en": "Classification run mode",
            "pt": "Modo de execução da classificação"
          },
          "choices": [
            "greedy",
            "mem"
          ]
        }
      ],
      "requires": [
        {
          "tools": [
            "ribodetector"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kaiju_classify",
        "kaiju_table"
      ]
    },
    "domain_filter": {
      "name": "Domain Filter (Prokaryote/Eukaryote)",
      "description": {
        "en": "Splits the rRNA-depleted reads by taxonomic domain before assembly -- a soil/sediment metatranscriptome mixes bacterial/archaeal and fungal/protist RNA together, so this lets a run analyze prokaryotes only, eukaryotes only, or both kept separate. Requires Kraken2 (Kaiju's output format doesn't support this).",
        "pt": "Separa as reads depletadas de rRNA por domínio taxonômico antes da montagem -- um metatranscriptoma de solo/sedimento mistura RNA bacteriano/arqueal com fúngico/protista, então isso permite analisar só procariotos, só eucariotos, ou ambos mantidos separados. Requer o Kraken2 (o formato de saída do Kaiju não suporta isso)."
      },
      "citation": [
        {
          "text": "Lu J, Rincon N, Wood DE, Breitwieser FP, Pockrandt C, Langmead B, Salzberg SL, Steinegger M. Metagenome analysis using the Kraken software suite. Nature Protocols. 2022;17:2815-2839.",
          "doi": "10.1038/s41596-022-00738-y"
        }
      ],
      "category": "Contamination Screening",
      "read_type": "all",
      "flags": [
        {
          "flag": "mode",
          "type": "choice",
          "default": "prokaryote",
          "enabled": true,
          "description": {
            "en": "Which taxonomic domain(s) to extract into separate read sets",
            "pt": "Qual(is) domínio(s) taxonômico(s) extrair em conjuntos de reads separados"
          },
          "choices": [
            "prokaryote",
            "eukaryote",
            "both"
          ]
        }
      ],
      "requires": [
        {
          "tools": [
            "kraken2"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "extract_domain_short",
        "extract_domain_long"
      ]
    },
    "rnaspades": {
      "name": "rnaSPAdes",
      "description": {
        "en": "De novo transcript assembler (SPAdes RNA mode) for short reads -- part of the multi-assembler ensemble; its transcripts are pooled and deduplicated by the Transcript set (MMseqs2) step",
        "pt": "Montador de transcritos de novo (modo RNA do SPAdes) para reads curtas -- parte do ensemble de montadores; seus transcritos são reunidos e deduplicados pela etapa Conjunto de transcritos (MMseqs2)"
      },
      "citation": [
        {
          "text": "Bushmanova E, Antipov D, Lapidus A, Prjibelski AD. rnaSPAdes: a de novo transcriptome assembler and its application to RNA-Seq data. GigaScience. 2019;8(9):giz100.",
          "doi": "10.1093/gigascience/giz100"
