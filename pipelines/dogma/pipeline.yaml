      "rule_names": [
        "rnaspades"
      ]
    },
    "megahit": {
      "name": "MEGAHIT",
      "description": {
        "en": "Fast, memory-efficient de novo assembler for short reads -- part of the multi-assembler ensemble; recovers different transcripts than rnaSPAdes/Trinity, all merged by the Transcript set (MMseqs2) step",
        "pt": "Montador de novo rápido e econômico em memória para reads curtas -- parte do ensemble de montadores; recupera transcritos diferentes de rnaSPAdes/Trinity, todos unidos pela etapa Conjunto de transcritos (MMseqs2)"
      },
      "citation": [
        {
          "text": "Li D, Liu CM, Luo R, Sadakane K, Lam TW. MEGAHIT: an ultra-fast single-node solution for large and complex metagenomics assembly via succinct de Bruijn graph. Bioinformatics. 2015;31(10):1674-1676.",
          "doi": "10.1093/bioinformatics/btv033"
