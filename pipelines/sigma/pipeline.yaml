{
  "id": "sigma",
  "name": "SIGMA",
  "description": "Single Isolate Genome, Multi-platform Assembly",
  "category": "genomics",
  "tags": [
    "prokaryote",
    "isolate",
    "hybrid"
  ],
  "icon": "assets/pipeline_icons/sigma.png",
  "snakefile": "Snakefile",
  "categories": [
    "QC & Trimming",
    "Contamination Screening",
    "Assembly",
    "Polishing",
    "Read Mapping",
    "Genome Quality",
    "Taxonomy",
    "Coverage",
    "Gene Prediction & Annotation",
    "Mobile Genetic Elements",
    "AMR & Virulence",
    "Strain Typing",
    "Viral Analysis",
    "Secondary Metabolites"
  ],
  "sample_sheet": {
    "columns": [
      "sample",
      "read_type",
      "fq1",
      "fq2",
      "fq_long",
      "assembler",
      "reference"
    ],
    "read_type_values": [
      "short",
      "long",
      "hybrid"
    ],
    "input_dirs": [
      {
        "key": "short_reads_dir",
        "label": "Pasta de reads curtas"
      },
      {
        "key": "long_reads_dir",
        "label": "Pasta de reads longas"
      },
      {
        "key": "reference_dir",
        "label": "Pasta de genomas de referência (opcional)"
      }
    ],
    "assembler_for_read_type": {
      "short": "unicycler",
      "long": "flye",
      "hybrid": "unicycler"
    }
  },
  "long_read_platforms": [
    {
      "id": "nano_raw",
      "label": "Nanopore (raw)",
      "flye_flag": "--nano-raw",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "nano_hq",
      "label": "Nanopore (HQ / Guppy5+ SUP, Q20+)",
      "flye_flag": "--nano-hq",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "pacbio_raw",
      "label": "PacBio (CLR)",
      "flye_flag": "--pacbio-raw",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-pb"
    },
    {
      "id": "pacbio_hifi",
      "label": "PacBio (HiFi)",
      "flye_flag": "--pacbio-hifi",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-hifi"
    }
  ],
  "default_long_read_platform": "nano_hq",
  "tools": {
    "fastp": {
      "name": "fastp",
      "description": {
        "en": "Fast all-in-one FASTQ preprocessor for short reads",
        "pt": "Pré-processador FASTQ rápido e completo para reads curtas"
      },
      "citation": [
        {
          "text": "Chen S, Zhou Y, Chen Y, Gu J. fastp: an ultra-fast all-in-one FASTQ preprocessor. Bioinformatics. 2018;34(17):i884-i890.",
          "doi": "10.1093/bioinformatics/bty560"
        }
      ],
      "category": "QC & Trimming",
      "read_type": "short",
      "flags": [
        {
          "flag": "--qualified_quality_phred",
          "type": "int",
          "default": 30,
          "enabled": true,
          "description": {
            "en": "Minimum Phred quality score for a base to be considered qualified",
            "pt": "Escore de qualidade Phred mínimo para uma base ser considerada qualificada"
          },
          "min": 0,
          "max": 40
        },
        {
          "flag": "--length_required",
          "type": "int",
          "default": 50,
          "enabled": true,
          "description": {
            "en": "Minimum read length after trimming; shorter reads are discarded",
            "pt": "Comprimento mínimo da read após o trimming; reads mais curtas são descartadas"
          },
          "min": 1
        },
        {
          "flag": "--trim_front1",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Number of bases to trim from the 5' end of read 1",
            "pt": "Número de bases a cortar da extremidade 5' da read 1"
          },
          "min": 0
        },
        {
          "flag": "--trim_front2",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Number of bases to trim from the 5' end of read 2",
            "pt": "Número de bases a cortar da extremidade 5' da read 2"
          },
          "min": 0
        },
        {
          "flag": "--cut_front",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable sliding window quality trimming from the 5' end",
            "pt": "Ativa o trimming de qualidade por janela deslizante a partir da extremidade 5'"
          }
        },
        {
          "flag": "--cut_tail",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable sliding window quality trimming from the 3' end",
            "pt": "Ativa o trimming de qualidade por janela deslizante a partir da extremidade 3'"
          }
        },
        {
          "flag": "--cut_mean_quality",
          "type": "int",
          "default": 20,
          "enabled": false,
          "description": {
            "en": "Mean quality threshold for the sliding window cut",
            "pt": "Limiar de qualidade média para o corte por janela deslizante"
          },
          "min": 0,
          "max": 40
        },
        {
          "flag": "--detect_adapter_for_pe",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Automatically detect adapter sequences for paired-end reads",
            "pt": "Detecta automaticamente sequências de adaptador em reads paired-end"
          }
        },
        {
          "flag": "--dedup",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable deduplication to remove duplicate reads",
            "pt": "Ativa a deduplicação para remover reads duplicadas"
          }
        },
        {
          "flag": "--low_complexity_filter",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Filter low-complexity reads (e.g. poly-A/T)",
            "pt": "Filtra reads de baixa complexidade (ex.: poli-A/T)"
          }
        }
      ],
      "requires": [],
      "rule_names": [
        "fastp"
      ]
    },
    "filtlong": {
      "name": "Filtlong",
      "description": {
        "en": "Quality filtering for long reads (Nanopore/PacBio)",
        "pt": "Filtragem de qualidade para reads longas (Nanopore/PacBio)"
      },
      "citation": [
        {
          "text": "Wick RR. Filtlong [software]. https://github.com/rrwick/Filtlong",
          "doi": null
        }
      ],
      "category": "QC & Trimming",
      "read_type": "long",
      "flags": [
        {
          "flag": "--min_length",
          "type": "int",
          "default": 500,
          "enabled": true,
          "description": {
            "en": "Minimum read length to keep (bp)",
            "pt": "Comprimento mínimo da read a manter (pb)"
          },
          "min": 1
        },
        {
          "flag": "--max_length",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Maximum read length to keep; 0 = no limit (bp)",
            "pt": "Comprimento máximo da read a manter; 0 = sem limite (pb)"
          },
          "min": 0
        },
        {
          "flag": "--keep_percent",
          "type": "float",
          "default": 90.0,
          "enabled": true,
          "description": {
            "en": "Keep only the best X% of bases by quality",
            "pt": "Mantém apenas os X% melhores das bases por qualidade"
          },
          "min": 1.0,
          "max": 100.0
        },
        {
          "flag": "--target_bases",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Target total number of output bases; 0 = no limit",
            "pt": "Número total alvo de bases na saída; 0 = sem limite"
          }
        },
        {
          "flag": "--min_mean_q",
          "type": "float",
          "default": 0.0,
          "enabled": false,
          "description": {
            "en": "Minimum mean quality score for a read to pass",
            "pt": "Escore de qualidade média mínimo para uma read passar"
          },
          "min": 0.0
        }
      ],
      "requires": [],
      "rule_names": [
        "filtlong"
      ]
    },
    "kraken2": {
      "name": "Kraken2",
      "description": {
        "en": "Pre-assembly contamination screening -- flags whether the clean reads look like a pure culture of one organism before spending time assembling/annotating them",
        "pt": "Triagem de contaminação antes da montagem -- sinaliza se as reads limpas parecem uma cultura pura de um único organismo antes de gastar tempo montando/anotando"
      },
      "citation": [
        {
          "text": "Wood DE, Lu J, Langmead B. Improved metagenomic analysis with Kraken 2. Genome Biology. 2019;20:257.",
          "doi": "10.1186/s13059-019-1891-0"
        }
      ],
      "category": "Contamination Screening",
      "read_type": "all",
      "flags": [
        {
          "flag": "--confidence",
          "type": "float",
          "default": 0.05,
          "enabled": true,
          "description": {
            "en": "Confidence score threshold (0-1); higher values increase precision",
            "pt": "Limiar de escore de confiança (0-1); valores maiores aumentam a precisão"
          },
          "min": 0.0,
          "max": 1.0
        },
        {
          "flag": "--minimum-hit-groups",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Minimum number of hit groups required for classification",
            "pt": "Número mínimo de grupos de hits exigido para classificação"
          },
          "min": 1
        },
        {
          "flag": "--report-zero-counts",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Include taxa with zero read counts in the report",
            "pt": "Inclui táxons com contagem zero de reads no relatório"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp",
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kraken2"
      ]
    },
    "kaiju": {
      "name": "Kaiju",
      "description": {
        "en": "Protein-level pre-assembly contamination screening -- independent alternative or complement to Kraken2, only needs the same clean reads",
        "pt": "Triagem de contaminação em nível de proteína antes da montagem -- alternativa ou complemento independente ao Kraken2, só precisa das mesmas reads limpas"
      },
      "citation": [
        {
          "text": "Menzel P, Ng KL, Krogh A. Fast and sensitive taxonomic classification for metagenomics with Kaiju. Nature Communications. 2016;7:11257.",
          "doi": "10.1038/ncomms11257"
        }
      ],
      "category": "Contamination Screening",
      "read_type": "all",
      "flags": [
        {
          "flag": "-a",
          "type": "choice",
          "default": "greedy",
          "enabled": false,
          "description": {
            "en": "Classification run mode",
            "pt": "Modo de execução da classificação"
          },
          "choices": [
            "greedy",
            "mem"
          ]
        },
        {
          "flag": "-e",
          "type": "int",
          "default": 3,
          "enabled": false,
          "description": {
            "en": "Mismatches allowed in Greedy mode",
            "pt": "Mismatches permitidos no modo Greedy"
          },
          "min": 0
        },
        {
          "flag": "-m",
          "type": "int",
          "default": 11,
          "enabled": false,
          "description": {
            "en": "Minimum match length",
            "pt": "Comprimento mínimo do match"
          },
          "min": 1
        },
        {
          "flag": "-s",
          "type": "int",
          "default": 65,
          "enabled": false,
          "description": {
            "en": "Minimum match score in Greedy mode",
            "pt": "Escore mínimo do match no modo Greedy"
          },
          "min": 1
        },
        {
          "flag": "-E",
          "type": "float",
          "default": 0.01,
          "enabled": false,
          "description": {
            "en": "Minimum E-value in Greedy mode",
            "pt": "E-value mínimo no modo Greedy"
          },
          "min": 0.0
        },
        {
          "flag": "-X",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Disable the SEG low-complexity filter (enabled by default)",
            "pt": "Desativa o filtro de baixa complexidade SEG (ativado por padrão)"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp",
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kaiju_classify",
        "kaiju_table"
      ]
    },
    "unicycler": {
      "name": "Unicycler",
      "description": {
        "en": "Isolate genome assembler for short-only or short+long hybrid data; wraps SPAdes for the short-read graph and bridges repeats with long reads when given. Used instead of MEGAHIT, which is tuned for large, uneven-coverage metagenomic assemblies rather than single isolate genomes.",
        "pt": "Montador de genoma de isolado para dados apenas de reads curtas ou híbridos (curtas+longas); usa o SPAdes para o grafo de reads curtas e conecta repetições com reads longas quando fornecidas. Usado em vez do MEGAHIT, que é ajustado para montagens metagenômicas grandes e de cobertura desigual, não para genomas de isolados únicos."
      },
      "citation": [
        {
          "text": "Wick RR, Judd LM, Gorrie CL, Holt KE. Unicycler: resolving bacterial genome assemblies from short and long sequencing reads. PLOS Computational Biology. 2017;13(6):e1005595.",
          "doi": "10.1371/journal.pcbi.1005595"
        }
      ],
      "category": "Assembly",
      "read_type": "all",
      "flags": [
        {
          "flag": "--mode",
          "type": "choice",
          "default": "normal",
          "enabled": false,
          "description": {
            "en": "Assembly effort/optimization level",
            "pt": "Nível de esforço/otimização da montagem"
          },
          "choices": [
            "conservative",
            "normal",
            "bold"
          ]
        },
        {
          "flag": "--min_fasta_length",
          "type": "int",
          "default": 100,
          "enabled": false,
          "description": {
            "en": "Exclude contigs shorter than this from the output (bp)",
            "pt": "Exclui da saída contigs mais curtos que este valor (pb)"
          },
          "min": 1
        },
        {
          "flag": "--linear_seqs",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Expected number of linear (non-circular) sequences, e.g. for organisms with linear chromosomes/plasmids",
            "pt": "Número esperado de sequências lineares (não circulares), ex.: para organismos com cromossomos/plasmídeos lineares"
          },
          "min": 0
        },
        {
          "flag": "--no_correct",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Skip short-read error correction before assembly",
            "pt": "Pula a correção de erros das reads curtas antes da montagem"
          }
        },
        {
          "flag": "--no_pilon",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Skip Pilon polishing of the final assembly",
            "pt": "Pula o polimento com Pilon da montagem final"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp"
          ],
          "min": 1
        },
        {
          "tools": [
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "unicycler"
      ]
    },
    "flye": {
      "name": "Flye",
      "description": {
        "en": "De novo assembler for long reads only (Nanopore / PacBio)",
        "pt": "Montador de novo apenas para reads longas (Nanopore / PacBio)"
      },
      "citation": [
        {
          "text": "Kolmogorov M, Yuan J, Lin Y, Pevzner PA. Assembly of long, error-prone reads using repeat graphs. Nature Biotechnology. 2019;37:540-546.",
          "doi": "10.1038/s41587-019-0072-8"
        }
      ],
      "category": "Assembly",
      "read_type": "long",
      "flags": [
        {
          "flag": "--min-overlap",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Minimum read overlap in bp (0 = auto)",
            "pt": "Sobreposição mínima entre reads em pb (0 = automático)"
          },
          "min": 0
        },
        {
          "flag": "--iterations",
          "type": "int",
          "default": 1,
          "enabled": false,
          "description": {
            "en": "Number of polishing iterations after assembly",
            "pt": "Número de iterações de polimento após a montagem"
          },
          "min": 0
        },
        {
          "flag": "--genome-size",
          "type": "str",
          "default": "",
          "enabled": false,
          "description": {
            "en": "Estimated genome size (e.g. 5m for a typical bacterial genome); optional",
            "pt": "Tamanho estimado do genoma (ex.: 5m para um genoma bacteriano típico); opcional"
          }
        },
        {
          "flag": "--asm-coverage",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Sub-sample to this coverage for initial assembly (0 = use all)",
            "pt": "Subamostra até esta cobertura para a montagem inicial (0 = usa tudo)"
          },
          "min": 0
        },
        {
          "flag": "--scaffold",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable scaffolding of unresolved repeats",
            "pt": "Ativa o scaffolding de repetições não resolvidas"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "flye"
      ]
    },
    "racon": {
      "name": "Racon",
      "description": {
        "en": "Long-read-based polishing of long-only (Flye) assemblies; not run for short/hybrid samples since Unicycler already self-polishes",
        "pt": "Polimento baseado em reads longas para montagens apenas-longas (Flye); não roda para amostras curtas/híbridas pois o Unicycler já se autopolimenta"
      },
      "citation": [
        {
          "text": "Vaser R, Sović I, Nagarajan N, Šikić M. Fast and accurate de novo genome assembly from long uncorrected reads. Genome Research. 2017;27(5):737-746.",
          "doi": "10.1101/gr.214270.116"
        }
      ],
      "category": "Polishing",
      "read_type": "long",
      "flags": [
        {
          "flag": "-w",
          "type": "int",
          "default": 500,
          "enabled": false,
          "description": {
            "en": "Window length for the partial-order alignment consensus",
            "pt": "Comprimento da janela para o consenso de alinhamento por ordem parcial (POA)"
          },
          "min": 50
        },
        {
          "flag": "-e",
          "type": "float",
          "default": 0.3,
          "enabled": false,
          "description": {
            "en": "Error threshold for the POA graph",
            "pt": "Limiar de erro para o grafo POA"
          },
          "min": 0.0,
          "max": 1.0
        },
        {
          "flag": "-q",
          "type": "float",
          "default": 10.0,
          "enabled": false,
          "description": {
            "en": "Minimum average base quality for a window to be polished",
            "pt": "Qualidade média mínima de base para uma janela ser polida"
          },
          "min": 0.0
        }
      ],
      "requires": [
        {
          "tools": [
            "flye"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "racon_polish"
      ]
    },
    "medaka": {
      "name": "Medaka",
      "description": {
        "en": "Neural-net polishing of Racon output for Nanopore assemblies; skipped for PacBio (models are ONT-specific)",
        "pt": "Polimento com rede neural da saída do Racon para montagens Nanopore; pulado para PacBio (os modelos são específicos do ONT)"
      },
      "citation": [
        {
          "text": "Oxford Nanopore Technologies. Medaka. https://github.com/nanoporetech/medaka",
          "doi": null
        }
      ],
      "category": "Polishing",
      "read_type": "long",
      "flags": [
        {
          "flag": "-m",
          "type": "str",
          "default": "",
          "enabled": false,
          "description": {
            "en": "Medaka model name (empty = auto-detect from basecaller info)",
            "pt": "Nome do modelo do Medaka (vazio = detecta automaticamente pela info do basecaller)"
          }
        },
        {
          "flag": "-b",
          "type": "int",
          "default": 100,
          "enabled": false,
          "description": {
            "en": "Batch size for neural-network inference",
            "pt": "Tamanho do batch para a inferência da rede neural"
          },
          "min": 1
        }
      ],
      "requires": [
        {
          "tools": [
            "racon"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "medaka_polish"
      ]
    },
    "ragtag": {
      "name": "RagTag",
      "description": {
        "en": "De novo vs reference-based assembly: orders/orients contigs against a reference genome (homology-based scaffolding, not variant calling) -- only runs for samples with a matching folder under the reference genomes input",
        "pt": "De novo vs. montagem baseada em referência: ordena/orienta contigs contra um genoma de referência (scaffolding por homologia, não chamada de variantes) -- só roda para amostras com pasta correspondente na entrada de genomas de referência"
      },
      "citation": [
        {
          "text": "Alonge M, Lebeigle L, Kirsche M, Jenike K, Ou S, Aganezov S, Wang X, Lippman ZB, Schatz MC, Soyk S. Automated assembly scaffolding using RagTag elevates a new tomato system for high-throughput genome editing. Genome Biology. 2022;23:258.",
          "doi": "10.1186/s13059-022-02823-7"
        }
      ],
      "category": "Polishing",
      "read_type": "all",
      "flags": [
        {
          "flag": "-u",
          "type": "bool",
          "default": true,
          "enabled": true,
          "description": {
            "en": "Add a suffix to unplaced sequence headers (avoids duplicate IDs some downstream tools reject)",
            "pt": "Adiciona um sufixo aos cabeçalhos das sequências não posicionadas (evita IDs duplicados que algumas ferramentas seguintes rejeitam)"
          }
        },
        {
          "flag": "-C",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Concatenate unplaced contigs into a single 'chr0' sequence",
            "pt": "Concatena os contigs não posicionados em uma única sequência 'chr0'"
          }
        },
        {
          "flag": "-r",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Infer gap sizes instead of using a fixed 100 bp gap",
            "pt": "Infere o tamanho dos gaps em vez de usar um gap fixo de 100 pb"
          }
        },
        {
          "flag": "-f",
          "type": "int",
          "default": 1000,
          "enabled": false,
          "description": {
            "en": "Minimum unique alignment length (bp)",
            "pt": "Comprimento mínimo de alinhamento único (pb)"
          },
          "min": 1
        },
        {
          "flag": "-q",
          "type": "int",
          "default": 10,
          "enabled": false,
          "description": {
            "en": "Minimum mapping quality",
            "pt": "Qualidade mínima de mapeamento"
          },
