    }
  ],
  "default_long_read_platform": "ont",
  "tools": {
    "nanoplot": {
      "name": "NanoPlot",
      "description": {
        "en": "QC report on the raw and cleaned long reads (read length/quality distributions) -- same tool MAGMA/SIGMA/DOGMA already use for their own long-read paths, kept deliberately instead of Cramino since this runs pre-filtering on raw FASTQ, where no BAM exists yet",
        "pt": "Relatório de QC das reads longas brutas e limpas (distribuições de comprimento/qualidade) -- mesma ferramenta que MAGMA/SIGMA/DOGMA já usam no próprio caminho de reads longas, mantida deliberadamente em vez do Cramino já que isso roda antes da filtragem, em FASTQ bruto onde ainda não existe BAM"
      },
      "citation": [
        {
          "text": "De Coster W, Rademakers R. NanoPack2: population-scale evaluation of long-read sequencing data. Bioinformatics. 2023;39(5):btad311.",
          "doi": "10.1093/bioinformatics/btad311"
        }
      ],
      "category": "QC & Trimming",
      "read_type": "long",
      "flags": [],
      "requires": [],
      "rule_names": [
        "nanoplot_raw",
        "nanoplot_clean"
      ]
    },
    "filtlong": {
      "name": "Filtlong",
      "description": {
        "en": "Length + quality filtering for the raw amplicon reads. Full-length 16S is ~1500 bp (default window 1300-1700 bp below); full-length fungal ITS is much shorter (~400-900 bp) -- lower max_length when running the ITS marker gene, the defaults assume 16S",
        "pt": "Filtragem por comprimento + qualidade das reads brutas de amplicon. O 16S completo tem ~1500 pb (janela padrão de 1300-1700 pb abaixo); o ITS fúngico completo é bem mais curto (~400-900 pb) -- reduza o max_length ao rodar o gene marcador ITS, os padrões assumem 16S"
      },
      "citation": [
        {
          "text": "Wick RR. Filtlong [software]. https://github.com/rrwick/Filtlong",
          "doi": null
        }
      ],
      "category": "QC & Trimming",
      "read_type": "long",
      "flags": [
        {
          "flag": "--min_length",
          "type": "int",
          "default": 1300,
          "enabled": true,
          "description": {
            "en": "Minimum read length to keep (bp) -- lower this for ITS (~300 bp)",
            "pt": "Comprimento mínimo da read a manter (pb) -- reduza para ITS (~300 pb)"
          },
          "min": 1
        },
        {
          "flag": "--max_length",
          "type": "int",
          "default": 1700,
          "enabled": true,
          "description": {
            "en": "Maximum read length to keep (bp) -- lower this for ITS (~1000 bp)",
            "pt": "Comprimento máximo da read a manter (pb) -- reduza para ITS (~1000 pb)"
          },
          "min": 1
        },
        {
          "flag": "--keep_percent",
          "type": "float",
          "default": 90.0,
          "enabled": true,
          "description": {
            "en": "Keep only the best X% of bases by quality",
            "pt": "Mantém apenas os X% melhores das bases por qualidade"
          },
          "min": 1.0,
          "max": 100.0
        }
      ],
      "requires": [],
      "rule_names": [
        "filtlong"
      ]
    },
    "cutadapt": {
      "name": "Cutadapt",
      "description": {
        "en": "Removes the marker-gene primers and orients reads, discarding anything where the expected primer pair isn't found (standard amplicon practice -- avoids off-target/mispriming reads downstream). Defaults are the full-length 16S universal primers 27F/1492R (Callahan lab's PacBio 16S protocol); swap in ITS1F/ITS4 (CTTGGTCATTTAGAGGAAGTAA / TCCTCCGCTTATTGATATGC) when running the ITS marker gene",
        "pt": "Remove os primers do gene marcador e orienta as reads, descartando qualquer read em que o par de primers esperado não seja encontrado (prática padrão em amplicon -- evita reads fora do alvo/mal-priming a jusante). Os padrões são os primers universais de 16S completo 27F/1492R (protocolo PacBio 16S do laboratório Callahan); troque para ITS1F/ITS4 (CTTGGTCATTTAGAGGAAGTAA / TCCTCCGCTTATTGATATGC) ao rodar o gene marcador ITS"
      },
      "citation": [
        {
          "text": "Martin M. Cutadapt removes adapter sequences from high-throughput sequencing reads. EMBnet.journal. 2011;17(1):10-12.",
          "doi": "10.14806/ej.17.1.200"
        }
      ],
      "category": "Primer Removal",
      "read_type": "long",
      "flags": [
        {
          "flag": "-g",
          "type": "str",
          "default": "AGRGTTYGATYMTGGCTCAG",
          "enabled": false,
          "description": {
            "en": "Forward primer sequence (5' end) -- manual override; leave off so the Amplicon preset (Inputs tab) supplies it. Default shown here is 16S 27F.",
            "pt": "Sequência do primer forward (extremidade 5') -- sobreposição manual; deixe desligado para que o preset de Amplicon (aba Inputs) forneça o valor. O padrão mostrado aqui é o 27F do 16S."
          }
        },
        {
          "flag": "-G",
          "type": "str",
          "default": "TACGGYTACCTTGTTACGACTT",
          "enabled": false,
          "description": {
            "en": "Reverse primer sequence, in its own 5'->3' orientation -- cutadapt_trim reverse-complements it internally. Manual override; leave off so the Amplicon preset (Inputs tab) supplies it. Default shown here is 16S 1492R (Lane 1991).",
            "pt": "Sequência do primer reverse, na orientação 5'->3' dele mesmo -- cutadapt_trim faz o reverso-complemento internamente. Sobreposição manual; deixe desligado para que o preset de Amplicon (aba Inputs) forneça o valor. O padrão mostrado aqui é o 1492R do 16S (Lane 1991)."
          }
        },
        {
          "flag": "-e",
          "type": "float",
          "default": 0.1,
          "enabled": true,
          "description": {
            "en": "Maximum allowed primer-matching error rate",
            "pt": "Taxa de erro máxima permitida no pareamento do primer"
          },
          "min": 0.0,
          "max": 0.3
        }
      ],
      "requires": [],
      "rule_names": [
        "cutadapt_trim"
      ]
    },
    "vsearch_chimera": {
      "name": "VSEARCH (chimera filtering)",
      "description": {
        "en": "Clusters primer-trimmed reads at 95% identity, then runs de novo chimera detection (uchime_denovo) on the clusters. Clustering first is necessary: raw long reads rarely duplicate exactly, so after exact dereplication every cluster is a singleton and uchime_denovo's abundance-skew logic has nothing to compare. Uses classic uchime_denovo rather than uchime3_denovo (tuned for short-read denoised amplicons) -- the most precise filter on long-read amplicons in Hakimzadeh et al. 2025 (PeerJ). Flagged sequences are set aside for inspection, not discarded",
        "pt": "Agrupa as reads sem primers a 95% de identidade e roda detecção de quimeras de novo (uchime_denovo) sobre os clusters. Agrupar antes é necessário: reads longas brutas quase nunca duplicam exatamente, então após a dereplicação exata todo cluster vira um singleton e a lógica de assimetria de abundância do uchime_denovo não tem o que comparar. Usa o uchime_denovo clássico em vez do uchime3_denovo (ajustado para amplicons denoisados de reads curtas) -- o filtro mais preciso em amplicons long-read segundo Hakimzadeh et al. 2025 (PeerJ). Sequências sinalizadas são separadas para inspeção, não descartadas"
      },
      "citation": [
        {
          "text": "Rognes T, Flouri T, Nichols B, Quince C, Mahé F. VSEARCH: a versatile open source tool for metagenomics. PeerJ. 2016;4:e2584.",
          "doi": "10.7717/peerj.2584"
        },
        {
          "text": "Hakimzadeh A, Mikryukov V, Metsoja M, Tedersoo L, Anslan S. Are we throwing away good data? Evaluation of chimera detection algorithms on long-read amplicons reveals high false-positive rates across algorithms. PeerJ. 2025.",
          "doi": "10.7717/peerj.20456"
        }
      ],
      "category": "Chimera Filtering",
      "read_type": "long",
      "flags": [
        {
          "flag": "--id",
          "type": "float",
          "default": 0.95,
          "enabled": true,
          "description": {
            "en": "Clustering identity threshold before chimera-checking -- lower for noisier long-read platforms (ONT), can go higher for PacBio HiFi's much lower error rate",
            "pt": "Limiar de identidade do agrupamento antes de checar quimeras -- reduza para plataformas long-read com mais ruído (ONT), pode aumentar para a taxa de erro bem menor do PacBio HiFi"
          },
          "min": 0.8,
          "max": 0.99
        },
        {
          "flag": "--abskew",
          "type": "float",
          "default": 2.0,
          "enabled": true,
          "description": {
            "en": "Minimum abundance skew between a sequence and its two \"parents\" to call it chimeric",
            "pt": "Assimetria mínima de abundância entre uma sequência e seus dois \"pais\" para considerá-la quimérica"
          },
          "min": 1.0,
          "max": 5.0
        }
      ],
      "requires": [
        {
          "tools": [
            "cutadapt"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "vsearch_cluster",
        "vsearch_chimera"
      ]
    },
    "dada2_pacbio": {
      "name": "DADA2 (PacBio HiFi)",
      "description": {
        "en": "Exact amplicon sequence variant (ASV) inference for PacBio HiFi/CCS reads -- runs only when the run's long-read platform is set to PacBio HiFi. HiFi's near-zero error rate (Q93) lets DADA2's own error-model/exact-sequence approach work directly on long reads, the same core algorithm as short-read Illumina data just reparameterized for length/quality (Callahan et al. 2019). Taxonomy assigned via DADA2's naive Bayes classifier against the configured reference for the chosen marker gene/database combination -- see --gene/--reference_db",
        "pt": "Inferência exata de variantes de sequência de amplicon (ASV) para reads PacBio HiFi/CCS -- roda apenas quando a plataforma de reads longas da run está configurada como PacBio HiFi. A taxa de erro quase zero do HiFi (Q93) permite que o próprio modelo de erro/abordagem de sequência exata do DADA2 funcione direto em reads longas, o mesmo algoritmo central usado em dados Illumina de reads curtas, apenas reparametrizado para o comprimento/qualidade (Callahan et al. 2019). Taxonomia atribuída via o classificador naive Bayes do DADA2 contra a referência configurada para a combinação de gene marcador/banco escolhida -- ver --gene/--reference_db"
      },
      "citation": [
        {
          "text": "Callahan BJ, Wong J, Siavoshi C, Vuong C, Sørensen EA, Ravel J, Knight R. High-throughput amplicon sequencing of the full-length 16S rRNA gene with single-nucleotide resolution. Nucleic Acids Research. 2019;47(18):e103.",
          "doi": "10.1093/nar/gkz569"
        }
      ],
      "category": "Denoising & Classification",
      "read_type": "long",
      "flags": [
        {
          "flag": "--gene",
          "type": "choice",
          "default": "16S",
          "enabled": true,
          "description": {
            "en": "Marker gene -- 16S/18S (small subunit, GTDB or SILVA SSU), 23S/28S (large subunit, SILVA LSU only), ITS (fungal, UNITE only), rrn_operon (full 16S-ITS-23S operon, ~4.3 kb, GROND only -- long-read exclusive). Normally set for you by the amplicon preset chosen on the Inputs tab.",
            "pt": "Gene marcador -- 16S/18S (subunidade pequena, GTDB ou SILVA SSU), 23S/28S (subunidade grande, apenas SILVA LSU), ITS (fúngico, apenas UNITE), rrn_operon (operon 16S-ITS-23S completo, ~4,3 kb, apenas GROND -- exclusivo de leitura longa). Normalmente definido automaticamente pelo preset de amplicon escolhido na aba Entradas."
          },
          "choices": [
            "16S",
            "18S",
            "23S",
            "28S",
            "ITS",
            "rrn_operon"
          ]
        },
        {
          "flag": "--reference_db",
          "type": "choice",
          "default": "gtdb",
          "enabled": true,
          "description": {
            "en": "Reference database -- gtdb only supports --gene 16S; silva supports 16S/18S/23S/28S (one combined SSU file serves 16S+18S, one combined LSU file serves 23S+28S); unite is selected automatically for --gene ITS regardless of this flag",
            "pt": "Banco de referência -- gtdb só suporta --gene 16S; silva suporta 16S/18S/23S/28S (um arquivo SSU combinado atende 16S+18S, um arquivo LSU combinado atende 23S+28S); unite é selecionado automaticamente para --gene ITS independente desta flag"
          },
          "choices": [
            "gtdb",
            "silva"
          ]
        },
        {
          "flag": "--max_ee",
          "type": "float",
          "default": 2.0,
          "enabled": true,
          "description": {
            "en": "Maximum expected errors per read to keep during filtering",
            "pt": "Máximo de erros esperados por read a manter durante a filtragem"
          },
          "min": 0.5,
          "max": 10.0
        },
        {
          "flag": "--min_asv_totalfreq",
          "type": "int",
          "default": 5,
          "enabled": true,
          "description": {
            "en": "Minimum total read count across all samples for an ASV to be kept",
            "pt": "Contagem total mínima de reads em todas as amostras para uma ASV ser mantida"
          },
          "min": 1
        }
      ],
      "requires": [
        {
          "tools": [
            "vsearch_chimera"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "dada2_pacbio"
      ]
    },
    "emu_ont": {
      "name": "Emu (Nanopore)",
      "description": {
        "en": "Species-level community profiling for Nanopore reads via expectation-maximization against a reference database -- runs only when the run's long-read platform is set to Nanopore. Even current R10.4.1/Kit 14 chemistry (~99% per-read accuracy) is too error-prone for DADA2's exact-sequence model, which is why Nanopore needs a reference-based EM approach instead of ASV-calling (Curry et al. 2022). Classified against the same configured reference/marker-gene combination as the PacBio path (see --gene/--reference_db) for a consistent taxonomy shape between platforms",
        "pt": "Perfilamento de comunidade em nível de espécie para reads Nanopore via expectation-maximization contra um banco de referência -- roda apenas quando a plataforma de reads longas da run está configurada como Nanopore. Mesmo a química atual R10.4.1/Kit 14 (~99% de acurácia por read) é erro demais para o modelo de sequência exata do DADA2, por isso o Nanopore precisa de uma abordagem baseada em referência via EM em vez de chamada de ASV (Curry et al. 2022). Classificado contra a mesma combinação de referência/gene marcador do caminho PacBio (ver --gene/--reference_db) para manter o formato de taxonomia consistente entre plataformas"
      },
      "citation": [
        {
          "text": "Curry KD, Wang Q, Nute MG, et al. Emu: species-level microbial community profiling of full-length 16S rRNA Oxford Nanopore sequencing data. Nature Methods. 2022;19:845-853.",
          "doi": "10.1038/s41592-022-01520-4"
        }
      ],
      "category": "Denoising & Classification",
      "read_type": "long",
      "flags": [
        {
          "flag": "--gene",
          "type": "choice",
          "default": "16S",
          "enabled": true,
          "description": {
            "en": "Marker gene -- 16S/18S (small subunit, GTDB or SILVA SSU), 23S/28S (large subunit, SILVA LSU only), ITS (fungal, UNITE only), rrn_operon (full 16S-ITS-23S operon, ~4.3 kb, GROND only -- long-read exclusive). Normally set for you by the amplicon preset chosen on the Inputs tab.",
            "pt": "Gene marcador -- 16S/18S (subunidade pequena, GTDB ou SILVA SSU), 23S/28S (subunidade grande, apenas SILVA LSU), ITS (fúngico, apenas UNITE), rrn_operon (operon 16S-ITS-23S completo, ~4,3 kb, apenas GROND -- exclusivo de leitura longa). Normalmente definido automaticamente pelo preset de amplicon escolhido na aba Entradas."
          },
          "choices": [
            "16S",
            "18S",
            "23S",
            "28S",
            "ITS",
            "rrn_operon"
          ]
        },
        {
          "flag": "--reference_db",
          "type": "choice",
          "default": "gtdb",
          "enabled": true,
          "description": {
            "en": "Reference database -- gtdb only supports --gene 16S; silva supports 16S/18S/23S/28S (one combined SSU file serves 16S+18S, one combined LSU file serves 23S+28S); unite is selected automatically for --gene ITS regardless of this flag",
            "pt": "Banco de referência -- gtdb só suporta --gene 16S; silva suporta 16S/18S/23S/28S (um arquivo SSU combinado atende 16S+18S, um arquivo LSU combinado atende 23S+28S); unite é selecionado automaticamente para --gene ITS independente desta flag"
          },
          "choices": [
            "gtdb",
            "silva"
          ]
        },
        {
          "flag": "--min-abundance",
          "type": "float",
          "default": 0.0001,
          "enabled": true,
          "description": {
            "en": "Minimum relative abundance for a species to be reported",
            "pt": "Abundância relativa mínima para uma espécie ser reportada"
          },
          "min": 0.0,
          "max": 0.1
        }
      ],
      "requires": [
        {
          "tools": [
            "vsearch_chimera"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "emu_ont"
      ]
    },
    "picrust2": {
      "name": "PICRUSt2 (functional inference)",
      "description": {
        "en": "Predicts community functional gene content (KEGG orthologs, EC numbers, MetaCyc pathways) from 16S taxonomy, with no shotgun sequencing needed. Each ASV is placed on PICRUSt2's bundled 16S reference tree (EPA-ng), and hidden-state prediction infers its gene content, weighted by predicted 16S copy number and combined with the ASV's per-sample abundance (Douglas et al. 2020). Runs only on the PacBio path with --gene 16S: it needs per-ASV sequences, which the reference-only Emu path does not produce, and PICRUSt2's reference tree is 16S-specific. ASVs above --max_nsti are excluded rather than guessed at",
        "pt": "Prevê o conteúdo funcional de genes da comunidade (ortólogos KEGG, números EC, vias MetaCyc) a partir da taxonomia de 16S, sem sequenciamento shotgun. Cada ASV é posicionada na árvore de referência 16S do PICRUSt2 (EPA-ng) e uma predição de estado oculto infere seu conteúdo gênico, ponderado pelo número previsto de cópias de 16S e combinado com a abundância da ASV por amostra (Douglas et al. 2020). Só roda no caminho PacBio com --gene 16S: precisa de sequências por ASV, que o caminho Emu (só referência) não produz, e a árvore do PICRUSt2 é específica de 16S. ASVs acima de --max_nsti são excluídas em vez de estimadas"
      },
      "citation": [
        {
          "text": "Douglas GM, Maffei VJ, Zaneveld JR, et al. PICRUSt2 for prediction of metagenome functions. Nature Biotechnology. 2020;38:685-688.",
          "doi": "10.1038/s41587-020-0548-6"
        }
      ],
      "category": "Functional Inference",
      "read_type": "long",
      "flags": [
        {
          "flag": "--max_nsti",
          "type": "float",
          "default": 2.0,
          "enabled": true,
          "description": {
            "en": "Maximum Nearest Sequenced Taxon Index (phylogenetic distance to the closest reference genome) -- ASVs above this are excluded, PICRUSt2's own default",
            "pt": "Índice máximo do Táxon Sequenciado Mais Próximo (distância filogenética até o genoma de referência mais próximo) -- ASVs acima disso são excluídas, padrão do próprio PICRUSt2"
          },
          "min": 0.5,
          "max": 5.0
        },
        {
          "flag": "--stratified",
          "type": "bool",
          "default": false,
          "enabled": true,
          "description": {
            "en": "Also output per-ASV contributions to each predicted function, not just the per-sample total -- real diagnostic value, but noticeably slower",
            "pt": "Também gera a contribuição de cada ASV para cada função prevista, não só o total por amostra -- valor real de diagnóstico, mas visivelmente mais lento"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "dada2_pacbio"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "picrust2"
      ]
    }
  },
  "databases": {
    "gtdb_ssu": {
      "name": "GTDB 16S (DADA2/Emu-formatted)",
      "description": {
        "en": "Full-length 16S rRNA reference for bacteria + archaea, GTDB taxonomy, DADA2-formatted (7-rank lineage strings) -- used directly by the PacBio path's assignTaxonomy() and to build the Nanopore path's custom Emu database, so both platforms report taxonomy in the same GTDB rank shape MAGMA/SIGMA/DOGMA's own Plots tab analyses already expect",
        "pt": "Referência de 16S rRNA completo para bactérias + archaea, taxonomia GTDB, formatada para DADA2 (strings de linhagem em 7 ranks) -- usada diretamente pelo assignTaxonomy() do caminho PacBio e para construir o banco Emu customizado do caminho Nanopore, para que as duas plataformas reportem taxonomia no mesmo formato de ranks GTDB que as análises da aba Plots do MAGMA/SIGMA/DOGMA já esperam"
      },
      "citation": [
        {
          "text": "Parks DH, Chuvochina M, Rinke C, Mussig AJ, Chaumeil PA, Hugenholtz P. GTDB: an ongoing census of bacterial and archaeal diversity through a phylogenetically consistent, rank normalized and complete genome-based taxonomy. Nucleic Acids Research. 2022;50(D1):D785-D794.",
          "doi": "10.1093/nar/gkab776"
        },
        {
          "text": "Alishum A. DADA2 formatted 16S rRNA gene sequences for both bacteria & archaea (GTDB release 220). Zenodo.",
          "doi": "10.5281/zenodo.13984843"
        }
      ],
      "setting_key": "db_gtdb_ssu",
      "size_gb": 1,
      "detect_files": [
        "*.fa"
      ],
      "detect_dirs": [],
      "download_options": [
        {
          "id": "gtdb_ssu_r220",
          "label": "GTDB r220 SSU, DADA2-formatted (~150 MB) ★ Recommended",
          "size_gb": 0.146,
          "description": {
            "en": "58,102 bacteria + 3,672 archaea full-length 16S sequences, 7-rank GTDB lineage",
            "pt": "58.102 bactérias + 3.672 archaea, sequências de 16S completo, linhagem GTDB em 7 ranks"
          },
          "url": "https://zenodo.org/records/13984843/files/GTDB_bac120_arc53_ssu_r220_fullTaxo.fa.gz",
          "extract": false
        }
      ],
      "config_key": "gtdb_ssu"
    },
    "silva_ssu": {
      "name": "SILVA SSU (16S + 18S, all domains)",
      "description": {
        "en": "Small subunit rRNA reference covering 16S (bacteria/archaea) and 18S (eukaryotes) together in one file, all three domains of life -- the real SILVA release, not the DADA2-pre-packaged bacteria/archaea-only training set, which is explicitly documented as unsuitable for eukaryote classification. Converted on download (accession-prefixed headers stripped to pure lineage, RNA sequence alphabet converted to DNA; see convert_silva_headers.py)",
