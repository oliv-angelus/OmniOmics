channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - filtlong=0.3.1
  - nanoplot=1.44.1
  # Real bug, caught by a real `snakemake --use-conda` execution (2026-08-07),
  # not assumed: nanoplot's own bioconda recipe declares a `python-kaleido`
  # dependency with NO version pin at all, so a fresh solve grabs whatever's
  # newest -- currently 1.3.0, which rewrote kaleido's whole API and dropped
  # the `kaleido.scopes.plotly.PlotlyScope` class nanoplotter/plot.py still
  # imports. Confirmed the failure (`ModuleNotFoundError: No module named
  # 'kaleido.scopes'`) and the fix (pin the last pre-rewrite release) for
  # real, not guessed.
  - python-kaleido=0.2.1
