channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bioconductor-dada2=1.34.0
  - r-optparse=1.7.5
  # Real, confirmed-by-running-it binary-compat bug: bioconda's
  # bioconductor-dada2=1.34.0 build was compiled against an older
  # r-rcppparallel that bundled its own internal TBB statically. The conda
  # solver's default (unpinned) r-rcppparallel resolves to a current build
  # (5.1.11_2 as of 2026-08) that dropped the bundled TBB in favor of
  # dynamically linking a system tbb>=2023.0.0 (oneTBB) -- but dada2.so
  # still references the classic pre-2021 TBB API (`tbb::task`), which
  # oneTBB removed entirely. Result: `library(dada2)` fails to load with
  # "undefined symbol: _ZTIN3tbb4taskE". Pinning r-rcppparallel back to 5.1.9
  # (a build with no external tbb dependency at all, matching dada2 1.34.0's
  # own build era) fixes it -- confirmed via a real `library(dada2)` load
  # test, not just reading dependency metadata.
  - r-rcppparallel=5.1.9
  # For phylogenetic tree construction: DECIPHER::AlignSeqs() for the
  # multiple alignment, then FastTree 2 (external binary, below) for the
  # GTR+CAT ML tree itself. See lib/build_tree.R's header comment for the
  # full method + citation trail and why this replaced phangorn on
  # 2026-09-12 (phangorn's optim.pml doesn't scale past a few hundred tips).
  - bioconductor-decipher=3.2.0
  - r-ape=5.8_1
  # FastTreeMP (OpenMP multithreaded build) -- see lib/build_tree.R.
  - fasttree=2.2.0
