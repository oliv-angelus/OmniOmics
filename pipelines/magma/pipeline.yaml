{
  "id": "magma",
  "name": "MAGMA",
  "description": "Metagenome Assisted GUI & MAG Analyses",
  "category": "metagenomics",
  "tags": [
    "prokaryote",
    "community",
    "hybrid"
  ],
  "icon": "assets/pipeline_icons/magma.png",
  "snakefile": "Snakefile",
  "categories": [
    "QC & Trimming",
    "Taxonomic Classification",
    "Assembly",
    "Read Mapping",
    "Binning",
    "Bin Quality & Dereplication",
    "Phylogenetics & Taxonomy",
    "Gene Prediction & Annotation",
    "Viral Analysis",
    "Mobile Genetic Elements",
    "Specialized Annotation"
  ],
  "sample_sheet": {
    "columns": [
      "sample",
      "read_type",
      "fq1",
      "fq2",
      "fq_long",
      "assembler"
    ],
    "read_type_values": [
      "short",
      "long",
      "hybrid"
    ],
    "input_dirs": [
      {
        "key": "short_reads_dir",
        "label": "Pasta de reads curtas"
      },
      {
        "key": "long_reads_dir",
        "label": "Pasta de reads longas"
      }
    ],
    "assembler_for_read_type": {
      "short": "megahit",
      "long": "flye",
      "hybrid": "metaspades_hybrid"
    }
  },
  "long_read_platforms": [
    {
      "id": "nano_raw",
      "label": "Nanopore (raw)",
      "flye_flag": "--nano-raw",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "nano_hq",
      "label": "Nanopore (HQ / Guppy5+ SUP, Q20+)",
      "flye_flag": "--nano-hq",
      "spades_flag": "--nanopore",
      "minimap2_preset": "map-ont"
    },
    {
      "id": "pacbio_raw",
      "label": "PacBio (CLR)",
      "flye_flag": "--pacbio-raw",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-pb"
    },
    {
      "id": "pacbio_hifi",
      "label": "PacBio (HiFi)",
      "flye_flag": "--pacbio-hifi",
      "spades_flag": "--pacbio",
      "minimap2_preset": "map-hifi"
    }
  ],
  "default_long_read_platform": "nano_hq",
  "tools": {
    "fastp": {
      "name": "fastp",
      "description": {
        "en": "Fast all-in-one FASTQ preprocessor for short reads",
        "pt": "Pré-processador FASTQ rápido e completo para reads curtas"
      },
      "citation": [
        {
          "text": "Chen S, Zhou Y, Chen Y, Gu J. fastp: an ultra-fast all-in-one FASTQ preprocessor. Bioinformatics. 2018;34(17):i884-i890.",
          "doi": "10.1093/bioinformatics/bty560"
        }
      ],
      "category": "QC & Trimming",
      "read_type": "short",
      "flags": [
        {
          "flag": "--qualified_quality_phred",
          "type": "int",
          "default": 30,
          "enabled": true,
          "description": {
            "en": "Minimum Phred quality score for a base to be considered qualified",
            "pt": "Escore de qualidade Phred mínimo para uma base ser considerada qualificada"
          },
          "min": 0,
          "max": 40
        },
        {
          "flag": "--length_required",
          "type": "int",
          "default": 50,
          "enabled": true,
          "description": {
            "en": "Minimum read length after trimming; shorter reads are discarded",
            "pt": "Comprimento mínimo da read após o trimming; reads mais curtas são descartadas"
          },
          "min": 1
        },
        {
          "flag": "--trim_front1",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Number of bases to trim from the 5' end of read 1",
            "pt": "Número de bases a cortar da extremidade 5' da read 1"
          },
          "min": 0
        },
        {
          "flag": "--trim_front2",
          "type": "int",
          "default": 1,
          "enabled": true,
          "description": {
            "en": "Number of bases to trim from the 5' end of read 2",
            "pt": "Número de bases a cortar da extremidade 5' da read 2"
          },
          "min": 0
        },
        {
          "flag": "--trim_tail1",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Number of bases to trim from the 3' end of read 1",
            "pt": "Número de bases a cortar da extremidade 3' da read 1"
          },
          "min": 0
        },
        {
          "flag": "--trim_tail2",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Number of bases to trim from the 3' end of read 2",
            "pt": "Número de bases a cortar da extremidade 3' da read 2"
          },
          "min": 0
        },
        {
          "flag": "--cut_front",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable sliding window quality trimming from the 5' end",
            "pt": "Ativa o trimming de qualidade por janela deslizante a partir da extremidade 5'"
          }
        },
        {
          "flag": "--cut_tail",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable sliding window quality trimming from the 3' end",
            "pt": "Ativa o trimming de qualidade por janela deslizante a partir da extremidade 3'"
          }
        },
        {
          "flag": "--cut_mean_quality",
          "type": "int",
          "default": 20,
          "enabled": false,
          "description": {
            "en": "Mean quality threshold for the sliding window cut",
            "pt": "Limiar de qualidade média para o corte por janela deslizante"
          },
          "min": 0,
          "max": 40
        },
        {
          "flag": "--detect_adapter_for_pe",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Automatically detect adapter sequences for paired-end reads",
            "pt": "Detecta automaticamente sequências de adaptador em reads paired-end"
          }
        },
        {
          "flag": "--dedup",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Enable deduplication to remove duplicate reads",
            "pt": "Ativa a deduplicação para remover reads duplicadas"
          }
        },
        {
          "flag": "--low_complexity_filter",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Filter low-complexity reads (e.g. poly-A/T)",
            "pt": "Filtra reads de baixa complexidade (ex.: poli-A/T)"
          }
        },
        {
          "flag": "--complexity_threshold",
          "type": "int",
          "default": 30,
          "enabled": false,
          "description": {
            "en": "Complexity threshold for low-complexity filter (0–100)",
            "pt": "Limiar de complexidade para o filtro de baixa complexidade (0–100)"
          },
          "min": 0,
          "max": 100
        }
      ],
      "requires": [],
      "rule_names": [
        "fastp"
      ]
    },
    "filtlong": {
      "name": "Filtlong",
      "description": {
        "en": "Quality filtering for long reads (Nanopore/PacBio)",
        "pt": "Filtragem de qualidade para reads longas (Nanopore/PacBio)"
      },
      "citation": [
        {
          "text": "Wick RR. Filtlong [software]. https://github.com/rrwick/Filtlong",
          "doi": null
        }
      ],
      "category": "QC & Trimming",
      "read_type": "long",
      "flags": [
        {
          "flag": "--min_length",
          "type": "int",
          "default": 500,
          "enabled": true,
          "description": {
            "en": "Minimum read length to keep (bp)",
            "pt": "Comprimento mínimo da read a manter (pb)"
          },
          "min": 1
        },
        {
          "flag": "--max_length",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Maximum read length to keep; 0 = no limit (bp)",
            "pt": "Comprimento máximo da read a manter; 0 = sem limite (pb)"
          },
          "min": 0
        },
        {
          "flag": "--keep_percent",
          "type": "float",
          "default": 90.0,
          "enabled": true,
          "description": {
            "en": "Keep only the best X% of bases by quality",
            "pt": "Mantém apenas os X% melhores das bases por qualidade"
          },
          "min": 1.0,
          "max": 100.0
        },
        {
          "flag": "--target_bases",
          "type": "int",
          "default": 0,
          "enabled": false,
          "description": {
            "en": "Target total number of output bases; 0 = no limit",
            "pt": "Número total alvo de bases na saída; 0 = sem limite"
          }
        },
        {
          "flag": "--min_mean_q",
          "type": "float",
          "default": 0.0,
          "enabled": false,
          "description": {
            "en": "Minimum mean quality score for a read to pass",
            "pt": "Escore de qualidade média mínimo para uma read passar"
          },
          "min": 0.0
        }
      ],
      "requires": [],
      "rule_names": [
        "filtlong"
      ]
    },
    "kraken2": {
      "name": "Kraken2",
      "description": {
        "en": "Ultrafast k-mer based taxonomic classification",
        "pt": "Classificação taxonômica ultrarrápida baseada em k-mer"
      },
      "citation": [
        {
          "text": "Wood DE, Lu J, Langmead B. Improved metagenomic analysis with Kraken 2. Genome Biology. 2019;20:257.",
          "doi": "10.1186/s13059-019-1891-0"
        }
      ],
      "category": "Taxonomic Classification",
      "read_type": "all",
      "flags": [
        {
          "flag": "--confidence",
          "type": "float",
          "default": 0.05,
          "enabled": true,
          "description": {
            "en": "Confidence score threshold (0–1); higher values increase precision",
            "pt": "Limiar de escore de confiança (0–1); valores maiores aumentam a precisão"
          },
          "min": 0.0,
          "max": 1.0
        },
        {
          "flag": "--minimum-hit-groups",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Minimum number of hit groups required for classification",
            "pt": "Número mínimo de grupos de hits exigido para classificação"
          },
          "min": 1
        },
        {
          "flag": "--report-zero-counts",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Include taxa with zero read counts in the report",
            "pt": "Inclui táxons com contagem zero de reads no relatório"
          }
        },
        {
          "flag": "--paired",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Input files are paired-end (enabled automatically by the pipeline)",
            "pt": "Os arquivos de entrada são paired-end (ativado automaticamente pelo pipeline)"
          }
        },
        {
          "flag": "--gzip-compressed",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Input files are gzip-compressed (enabled automatically by the pipeline)",
            "pt": "Os arquivos de entrada estão compactados em gzip (ativado automaticamente pelo pipeline)"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp",
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kraken2"
      ]
    },
    "bracken": {
      "name": "Bracken",
      "description": {
        "en": "Bayesian re-estimation of species abundance from Kraken2 reports",
        "pt": "Reestimativa bayesiana da abundância de espécies a partir de relatórios do Kraken2"
      },
      "citation": [
        {
          "text": "Lu J, Breitwieser FP, Thielen P, Salzberg SL. Bracken: estimating species abundance in metagenomics data. PeerJ Computer Science. 2017;3:e104.",
          "doi": "10.7717/peerj-cs.104"
        }
      ],
      "category": "Taxonomic Classification",
      "read_type": "all",
      "flags": [
        {
          "flag": "-l",
          "type": "choice",
          "default": "S",
          "enabled": true,
          "description": {
            "en": "Taxonomic level for abundance estimation",
            "pt": "Nível taxonômico para a estimativa de abundância"
          },
          "choices": [
            "D",
            "P",
            "C",
            "O",
            "F",
            "G",
            "S"
          ]
        },
        {
          "flag": "-r",
          "type": "int",
          "default": 150,
          "enabled": true,
          "description": {
            "en": "Read length used during Kraken2 database build (bp)",
            "pt": "Comprimento de read usado na construção do banco do Kraken2 (pb)"
          },
          "min": 50
        },
        {
          "flag": "-t",
          "type": "int",
          "default": 10,
          "enabled": false,
          "description": {
            "en": "Minimum number of reads required for re-estimation",
            "pt": "Número mínimo de reads exigido para a reestimativa"
          },
          "min": 1
        }
      ],
      "requires": [
        {
          "tools": [
            "kraken2"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "bracken"
      ]
    },
    "kreport2mpa": {
      "name": "kreport2mpa",
      "description": {
        "en": "Converts Kraken2 reports to MetaPhlAn-style output",
        "pt": "Converte relatórios do Kraken2 para o formato de saída do MetaPhlAn"
      },
      "citation": [
        {
          "text": "Lu J, Rincon N, Wood DE, Breitwieser FP, Pockrandt C, Langmead B, Salzberg SL, Steinegger M. Metagenome analysis using the Kraken software suite. Nature Protocols. 2022;17:2815-2839.",
          "doi": "10.1038/s41596-022-00738-y"
        }
      ],
      "category": "Taxonomic Classification",
      "read_type": "all",
      "flags": [],
      "requires": [
        {
          "tools": [
            "bracken"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kreport2mpa"
      ]
    },
    "kaiju": {
      "name": "Kaiju",
      "description": {
        "en": "Protein-level taxonomic classification -- independent alternative or complement to Kraken2/Bracken, only needs the same clean reads",
        "pt": "Classificação taxonômica em nível de proteína -- alternativa ou complemento independente ao Kraken2/Bracken, só precisa das mesmas reads limpas"
      },
      "citation": [
        {
          "text": "Menzel P, Ng KL, Krogh A. Fast and sensitive taxonomic classification for metagenomics with Kaiju. Nature Communications. 2016;7:11257.",
          "doi": "10.1038/ncomms11257"
        }
      ],
      "category": "Taxonomic Classification",
      "read_type": "all",
      "flags": [
        {
          "flag": "-a",
          "type": "choice",
          "default": "greedy",
          "enabled": false,
          "description": {
            "en": "Classification run mode",
            "pt": "Modo de execução da classificação"
          },
          "choices": [
            "greedy",
            "mem"
          ]
        },
        {
          "flag": "-e",
          "type": "int",
          "default": 3,
          "enabled": false,
          "description": {
            "en": "Mismatches allowed in Greedy mode",
            "pt": "Mismatches permitidos no modo Greedy"
          },
          "min": 0
        },
        {
          "flag": "-m",
          "type": "int",
          "default": 11,
          "enabled": false,
          "description": {
            "en": "Minimum match length",
            "pt": "Comprimento mínimo do match"
          },
          "min": 1
        },
        {
          "flag": "-s",
          "type": "int",
          "default": 65,
          "enabled": false,
          "description": {
            "en": "Minimum match score in Greedy mode",
            "pt": "Escore mínimo do match no modo Greedy"
          },
          "min": 1
        },
        {
          "flag": "-E",
          "type": "float",
          "default": 0.01,
          "enabled": false,
          "description": {
            "en": "Minimum E-value in Greedy mode",
            "pt": "E-value mínimo no modo Greedy"
          },
          "min": 0.0
        },
        {
          "flag": "-X",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Disable the SEG low-complexity filter (enabled by default)",
            "pt": "Desativa o filtro de baixa complexidade SEG (ativado por padrão)"
          }
        }
      ],
      "requires": [
        {
          "tools": [
            "fastp",
            "filtlong"
          ],
          "min": 1
        }
      ],
      "rule_names": [
        "kaiju_classify",
        "kaiju_table",
        "consolidate_taxonomy_kaiju"
      ]
    },
    "megahit": {
      "name": "MEGAHIT",
      "description": {
        "en": "Ultra-fast de novo assembler for short reads only",
        "pt": "Montador de novo ultrarrápido apenas para reads curtas"
      },
      "citation": [
        {
          "text": "Li D, Liu CM, Luo R, Sadakane K, Lam TW. MEGAHIT: an ultra-fast single-node solution for large and complex metagenomics assembly via succinct de Bruijn graph. Bioinformatics. 2015;31(10):1674-1676.",
          "doi": "10.1093/bioinformatics/btv033"
        }
      ],
      "category": "Assembly",
      "read_type": "short",
      "flags": [
        {
          "flag": "--min-contig-len",
          "type": "int",
          "default": 300,
          "enabled": true,
          "description": {
            "en": "Minimum contig length in output (bp)",
            "pt": "Comprimento mínimo do contig na saída (pb)"
          },
          "min": 100
        },
        {
          "flag": "-m",
          "type": "float",
          "default": 0.85,
          "enabled": true,
          "description": {
            "en": "Max memory fraction (0–1) or absolute bytes if >1",
            "pt": "Fração máxima de memória (0–1) ou bytes absolutos se >1"
          },
          "min": 0.1,
          "max": 1.0
        },
        {
          "flag": "--k-min",
          "type": "int",
          "default": 21,
          "enabled": false,
          "description": {
            "en": "Minimum k-mer size (odd, 15–255)",
            "pt": "Tamanho mínimo do k-mer (ímpar, 15–255)"
          },
          "min": 15,
          "max": 255
        },
        {
          "flag": "--k-max",
          "type": "int",
          "default": 141,
          "enabled": false,
          "description": {
            "en": "Maximum k-mer size (odd, 15–255)",
            "pt": "Tamanho máximo do k-mer (ímpar, 15–255)"
          },
          "min": 15,
          "max": 255
        },
        {
          "flag": "--k-step",
          "type": "int",
          "default": 10,
          "enabled": false,
          "description": {
            "en": "k-mer increment per iteration (even, ≤28)",
            "pt": "Incremento de k-mer por iteração (par, ≤28)"
          },
          "min": 2,
          "max": 28
        },
        {
          "flag": "--k-list",
          "type": "str",
          "default": "21,29,39,59,79,99,119,141",
          "enabled": false,
          "description": {
            "en": "Explicit k-mer list (overrides --k-min/max/step)",
            "pt": "Lista explícita de k-mers (sobrepõe --k-min/max/step)"
          }
        },
        {
          "flag": "--min-count",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Minimum multiplicity for (k_min+1)-mer filtering",
            "pt": "Multiplicidade mínima para o filtro de (k_min+1)-mer"
          },
          "min": 1
        },
        {
          "flag": "--prune-level",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Strength of low-depth pruning (0–3)",
            "pt": "Intensidade da poda de baixa profundidade (0–3)"
          },
          "min": 0,
          "max": 3
        },
        {
          "flag": "--prune-depth",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Remove unitigs with avg k-mer depth below this",
            "pt": "Remove unitigs com profundidade média de k-mer abaixo deste valor"
          },
          "min": 1
        },
        {
          "flag": "--bubble-level",
          "type": "int",
          "default": 2,
          "enabled": false,
          "description": {
            "en": "Intensity of bubble merging (0 = disable)",
            "pt": "Intensidade da fusão de bolhas (0 = desativar)"
          },
          "min": 0,
          "max": 2
        },
        {
          "flag": "--merge-level",
          "type": "str",
          "default": "20,0.95",
          "enabled": false,
          "description": {
            "en": "Merge complex bubbles: <len_multiplier>,<similarity>",
            "pt": "Funde bolhas complexas: <len_multiplier>,<similarity>"
          }
        },
        {
          "flag": "--disconnect-ratio",
          "type": "float",
          "default": 0.1,
          "enabled": false,
          "description": {
            "en": "Disconnect unitig if depth < ratio × siblings total",
            "pt": "Desconecta o unitig se a profundidade < razão × total dos irmãos"
          },
          "min": 0.0,
          "max": 1.0
        },
        {
          "flag": "--low-local-ratio",
          "type": "float",
          "default": 0.2,
          "enabled": false,
          "description": {
            "en": "Remove unitig if depth < ratio × neighbourhood avg",
            "pt": "Remove o unitig se a profundidade < razão × média da vizinhança"
          },
          "min": 0.0,
          "max": 1.0
        },
        {
          "flag": "--cleaning-rounds",
          "type": "int",
          "default": 5,
          "enabled": false,
          "description": {
            "en": "Number of graph-cleaning rounds",
            "pt": "Número de rodadas de limpeza do grafo"
          },
          "min": 1
        },
        {
          "flag": "--no-mercy",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Skip mercy k-mers (may reduce sensitivity on low-coverage)",
            "pt": "Pula os k-mers de misericórdia (mercy k-mers) (pode reduzir a sensibilidade em baixa cobertura)"
          }
        },
        {
          "flag": "--no-local",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Disable local assembly step",
            "pt": "Desativa a etapa de montagem local"
          }
        },
        {
          "flag": "--kmin-1pass",
          "type": "bool",
          "default": true,
          "enabled": false,
          "description": {
            "en": "Single-pass SdBG build at k_min (saves RAM)",
            "pt": "Construção do SdBG em passagem única em k_min (economiza RAM)"
          }
        },
        {
          "flag": "--presets",
          "type": "choice",
          "default": "",
          "enabled": false,
          "description": {
            "en": "Override parameters with a preset",
            "pt": "Sobrepõe os parâmetros com um preset"
          },
          "choices": [
            "meta-sensitive",
            "meta-large"
          ]
        },
        {
          "flag": "--mem-flag",
          "type": "int",
          "default": 1,
          "enabled": false,
          "description": {
